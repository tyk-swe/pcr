[package]
name = "packetcraftr-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "AGPL-3.0-only"

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

# Fuzz targets are a separate workspace, so they cannot inherit the root
# `[workspace.lints]` through `workspace = true`. Mirror it here and keep the
# two in sync: the root `Cargo.toml` remains the source of truth.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_panics_doc = "deny"
return_self_not_must_use = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_precision_loss = "deny"

[dependencies]
libfuzzer-sys = "=0.4.13"
packetcraftr = { path = "../crates/packetcraftr", version = "0.4.0", default-features = false }

[[bin]]
name = "capture_reader"
path = "fuzz_targets/capture_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_roundtrip"
path = "fuzz_targets/decode_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "packet_inputs"
path = "fuzz_targets/packet_inputs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dns_wire"
path = "fuzz_targets/dns_wire.rs"
test = false
doc = false
bench = false

[[bin]]
name = "reassembly_state"
path = "fuzz_targets/reassembly_state.rs"
test = false
doc = false
bench = false

[[bin]]
name = "filter_expression"
path = "fuzz_targets/filter_expression.rs"
test = false
doc = false
bench = false
