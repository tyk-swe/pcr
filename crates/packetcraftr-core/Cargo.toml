[package]
name = "packetcraftr-core"
description = "Runtime-neutral packet mechanics and bounded offline analysis for PacketcraftR"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
decrypt = ["dep:aes-gcm", "dep:chacha20poly1305", "dep:hkdf"]

# Deliberately runtime-neutral: this crate must not depend on
# `packetcraftr-netio` or `packetcraftr`. Keeping packet and offline analysis
# below those crates makes native I/O unavailable by construction.
[dependencies]
aes-gcm = { workspace = true, optional = true }
chacha20poly1305 = { workspace = true, optional = true }
hkdf = { workspace = true, optional = true }
bytes.workspace = true
md-5.workspace = true
noyalib.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
tempfile.workspace = true

[[bench]]
name = "benchmarks"
harness = false
