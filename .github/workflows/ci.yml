name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    name: Tooling and consumer regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Python tools without native privileges or optional packages
        run: |
          python3 --version
          python3 -m compileall -q scripts examples/consumers
          python3 -m unittest discover -s scripts/tests -v
          python3 -O -m unittest discover -s scripts/tests -v

  linux:
    name: Linux full native
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native development library
        run: sudo apt-get update && sudo apt-get install --yes libpcap-dev
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Format
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - name: Clippy for supported feature profiles
        shell: bash
        run: |
          cargo clippy --locked --workspace --all-targets --no-default-features -- -D warnings
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo clippy --locked --workspace --all-targets --no-default-features --features packetcraftr-cli/native-layer2 -- -D warnings
          cargo clippy --locked --workspace --all-targets --no-default-features --features packetcraftr-cli/native-layer3 -- -D warnings
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --all-features
      - name: Documentation for supported feature profiles
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --locked --workspace --no-default-features --no-deps --document-private-items
          cargo doc --locked --workspace --no-default-features --features packetcraftr-cli/native-layer3 --no-deps --document-private-items
          cargo doc --locked --workspace --all-features --no-deps --document-private-items
      - name: Exercise cleartext and TLS identification on IPv4 and IPv6 loopback
        run: python scripts/test-service-identification.py --require-clean --report target/service-identification/report.json
      - name: Preserve service identification evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: service-identification-linux
          path: target/service-identification/report.json
          if-no-files-found: error
          retention-days: 90

  msrv:
    name: Linux minimum supported Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native development library
        run: sudo apt-get update && sudo apt-get install --yes libpcap-dev
      - name: Install the minimum supported toolchain
        id: msrv
        run: |
          msrv="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["rust-version"])')"
          rustup toolchain install "$msrv" --profile minimal
          echo "version=$msrv" >> "$GITHUB_OUTPUT"
      - name: Check every workspace target with portable and all features
        run: |
          cargo +${{ steps.msrv.outputs.version }} check --locked --workspace --all-targets --no-default-features
          cargo +${{ steps.msrv.outputs.version }} check --locked --workspace --all-targets --all-features

  portable:
    name: Portable and pcap-free isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Test without native capabilities
        run: cargo test --locked --workspace --no-default-features
      - name: Run offline library examples
        run: |
          cargo run --locked -p packetcraftr-core --example build_decode_filter
          cargo run --locked -p packetcraftr-core --example capture_analysis
          cargo run --locked -p packetcraftr --example client_composition --no-default-features
      - name: Test a detached external consumer
        run: python3 scripts/check-external-consumer.py
      - name: Test the shipped pcap-free feature profile
        run: cargo test --locked -p packetcraftr-cli -p packetcraftr-netio --no-default-features --features packetcraftr-cli/native-layer3,packetcraftr-netio/native-layer3
      - name: Build the isolated pcap-free CLI
        run: cargo build --locked -p packetcraftr-cli --no-default-features --features native-layer3
      - name: Verify the binary has no libpcap dependency
        run: |
          ldd target/debug/packetcraftr > linked-libraries.txt
          ! grep -q libpcap linked-libraries.txt

  platforms:
    name: Native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The release workflow builds on these images; keep CI on the same baselines.
        os: [macos-14, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Clippy for supported feature profiles
        shell: bash
        run: |
          cargo clippy --locked --workspace --all-targets --no-default-features -- -D warnings
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo clippy --locked --workspace --all-targets --no-default-features --features packetcraftr-cli/native-layer2 -- -D warnings
          cargo clippy --locked --workspace --all-targets --no-default-features --features packetcraftr-cli/native-layer3 -- -D warnings
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test passive native providers and CLI integration
        run: cargo test --locked -p packetcraftr-netio -p packetcraftr-cli
      - name: Execute deterministic contracts with every native backend enabled
        run: cargo test --locked -p packetcraftr -p packetcraftr-netio -p packetcraftr-cli --all-features
      - name: Exercise cleartext and TLS identification on IPv4 and IPv6 loopback
        run: python scripts/test-service-identification.py --require-clean --report target/service-identification/report.json
      - name: Preserve service identification evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: service-identification-${{ matrix.os }}
          path: target/service-identification/report.json
          if-no-files-found: error
          retention-days: 90

  fuzz-check:
    name: Fuzz target compilation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: fuzz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned fuzz toolchain
        run: rustup toolchain install
      - name: Check every fuzz target with warnings denied
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --locked --bins

  decoder-oracle:
    name: Decoder oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize evidence
        run: |
          mkdir -p target/validation
          echo '{"status":"not_exercised","reason":"oracle provisioning has not completed"}' > target/validation/decode-oracle.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/decode-oracle-tool
          key: tshark-ubuntu-24.04-4.6.4-fbeab3d85c6c8a57
      - name: Install pinned Rust toolchain and oracle build dependencies
        run: |
          rustup toolchain install
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build flex bison libglib2.0-dev libgcrypt20-dev libc-ares-dev libpcre2-dev libxml2-dev libspeexdsp-dev zlib1g-dev
      - name: Build checksum-pinned offline decoder
        run: scripts/build-decode-oracle.sh > target/validation/oracle-build.log 2>&1
      - name: Build portable CLI
        run: cargo build --locked --release -p packetcraftr-cli --no-default-features
      - name: Compare independent decoder results
        run: python3 scripts/check-decode-oracle.py --report target/validation/decode-oracle.json
      - name: Preserve decoder evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: decode-oracle-evidence
          path: target/validation/
          if-no-files-found: error
          retention-days: 90

  native-isolated:
    if: github.event_name != 'pull_request'
    name: Isolated Linux native
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize native evidence
        run: |
          mkdir -p target/validation
          echo '{"status":"not_exercised","reason":"namespace launcher has not completed"}' > target/validation/native-isolated.json
      - name: Install prerequisites
        run: |
          rustup toolchain install
          sudo apt-get update
          sudo apt-get install --yes libpcap-dev iproute2 util-linux uidmap
      - name: Authorize mapping the checkout owner into the namespace
        run: |
          echo "root:$(id -u):1" | sudo tee -a /etc/subuid
          echo "root:$(id -g):1" | sudo tee -a /etc/subgid
      - name: Build native CLI
        run: cargo build --locked --release -p packetcraftr-cli --all-features
      - name: Exercise the loopback exchange in a fresh isolated namespace
        run: sudo python3 scripts/test-native-isolated.py --binary target/release/packetcraftr --report target/validation/native-isolated.json
      - name: Preserve native evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-isolated-evidence
          path: target/validation/
          if-no-files-found: error
          retention-days: 90
