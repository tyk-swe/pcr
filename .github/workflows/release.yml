name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example, v0.5.0-beta.1)
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag }}

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  preflight:
    name: validate release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      release_sha: ${{ steps.provenance.outputs.release_sha }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - name: Require the tagged commit to be on the default branch
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD)"
          default_branch="$(
            gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch
          )"
          git fetch --no-tags origin \
            "+refs/heads/${default_branch}:refs/remotes/origin/${default_branch}"
          git merge-base --is-ancestor \
            "$release_sha" "refs/remotes/origin/${default_branch}"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
      - name: Require independent native and decoder evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/check-release-evidence.py --repository "$GITHUB_REPOSITORY" \
            --commit "$(git rev-parse HEAD)" --output "$RUNNER_TEMP/release-metadata/validation"
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2
      - name: Recheck current advisories and dependency policy for release contents
        run: |
          cargo deny --locked check
          cargo deny --locked --manifest-path fuzz/Cargo.toml check advisories
      - name: Validate release tag and version
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          cargo metadata --locked --no-deps --format-version 1 \
            > "$RUNNER_TEMP/cargo-metadata.json"
          version="$(
            python3 - "$RUNNER_TEMP/cargo-metadata.json" <<'PY'
          import json
          import pathlib
          import sys

          metadata = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          # The workspace root is virtual; the released artifact is the CLI.
          released = [
              package
              for package in metadata["packages"]
              if package["name"] == "packetcraftr-cli"
          ]
          if len(released) != 1:
              raise SystemExit("could not identify exactly one packetcraftr-cli package")
          print(released[0]["version"])
          PY
          )"

          expected_tag="v${version}"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "tag '$RELEASE_TAG' does not match packetcraftr-cli version '$expected_tag'" >&2
            exit 1
          fi

          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Upload release metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-metadata
          path: ${{ runner.temp }}/release-metadata/
          if-no-files-found: error
          retention-days: 1

  build:
    name: build (${{ matrix.target.triple }}, ${{ matrix.variant.name }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        target:
          - triple: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            archive_extension: tar.gz
          - triple: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive_extension: tar.gz
          - triple: x86_64-apple-darwin
            os: macos-15-intel
            archive_extension: tar.gz
          - triple: aarch64-apple-darwin
            os: macos-14
            archive_extension: tar.gz
          - triple: x86_64-pc-windows-msvc
            os: windows-2022
            archive_extension: zip
        variant:
          - name: all-features
            cargo_args: --all-features
          - name: pcap-free
            cargo_args: --no-default-features --features native-layer3
    runs-on: ${{ matrix.target.os }}
    timeout-minutes: 30
    env:
      ARCHIVE_BASENAME: packetcraftr-v${{ needs.preflight.outputs.version }}-${{ matrix.target.triple }}-${{ matrix.variant.name }}
      TARGET: ${{ matrix.target.triple }}
      VARIANT: ${{ matrix.variant.name }}
      VERSION: ${{ needs.preflight.outputs.version }}
      RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-release-v2-${{ matrix.target.triple }}-${{ matrix.variant.name }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-release-v2-${{ matrix.target.triple }}-${{ matrix.variant.name }}-${{ hashFiles('rust-toolchain.toml') }}-
      - if: runner.os == 'Linux' && matrix.variant.name == 'all-features'
        name: Install libpcap development files
        run: sudo apt-get update && sudo apt-get install --yes libpcap-dev
      - name: Install Rust target
        run: rustup target add ${{ matrix.target.triple }}
      - name: Build release binary
        run: >-
          cargo build --locked --release --package packetcraftr-cli
          --target ${{ matrix.target.triple }} ${{ matrix.variant.cargo_args }}
      - name: Record packaged build identity
        shell: bash
        run: |
          executable="target/$TARGET/release/packetcraftr"
          if [[ "$RUNNER_OS" == Windows ]]; then executable="$executable.exe"; fi
          python scripts/build-manifest.py --binary "$executable" \
            --output "$RUNNER_TEMP/BUILD-METADATA.json" --commit "$RELEASE_SHA" \
            --target "$TARGET" --variant "$VARIANT"
      - name: Package and smoke-test archive
        shell: python
        run: |
          import os
          import pathlib
          import shutil
          import subprocess
          import sys

          temporary = pathlib.Path(os.environ["RUNNER_TEMP"])
          basename = os.environ["ARCHIVE_BASENAME"]
          target = os.environ["TARGET"]
          windows = "windows" in target
          staging = temporary / basename
          binary = pathlib.Path("target") / target / "release" / (
              "packetcraftr.exe" if windows else "packetcraftr"
          )
          sys.path.insert(0, str(pathlib.Path("scripts").resolve()))
          from release_assets import SOURCE_ASSETS

          for source in map(pathlib.Path, SOURCE_ASSETS):
              destination = staging / source
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, destination)
          shutil.copy2(binary, staging / binary.name)
          shutil.copy2(temporary / "BUILD-METADATA.json", staging / "BUILD-METADATA.json")
          # Completions and man pages come from the packaged binary itself, so
          # they always describe the shipped command definitions.
          subprocess.run([
              str(binary.resolve()), "reference", "documentation", "--directory", str(staging),
          ], check=True, timeout=60)

          archive = shutil.make_archive(
              str(temporary / basename), "zip" if windows else "gztar",
              root_dir=temporary, base_dir=basename,
          )
          extraction = temporary / "archive-smoke-test"
          shutil.unpack_archive(archive, extraction)
          root = extraction / basename
          if not windows and not os.access(root / binary.name, os.X_OK):
              raise SystemExit("packaged executable is not executable")
          subprocess.run([
              sys.executable, "scripts/verify-archive.py", "--root", str(root),
              "--version", os.environ["VERSION"], "--commit", os.environ["RELEASE_SHA"],
              "--target", target, "--variant", os.environ["VARIANT"],
          ], check=True)
      - if: runner.os == 'Linux' && matrix.variant.name == 'all-features'
        name: Verify full Linux binary links libpcap
        shell: bash
        run: ldd "target/$TARGET/release/packetcraftr" | grep -Eq 'libpcap\.so'
      - if: runner.os == 'Linux' && matrix.variant.name == 'pcap-free'
        name: Verify pcap-free Linux binary does not link libpcap
        shell: bash
        run: |
          ldd "target/$TARGET/release/packetcraftr" > linked-libraries.txt
          ! grep -Eq 'libpcap\.so' linked-libraries.txt
      - if: runner.os == 'Linux'
        name: Smoke-test the Ubuntu 24.04 runtime baseline
        shell: bash
        run: |
          docker run --rm -e VARIANT -v "$RUNNER_TEMP/archive-smoke-test/$ARCHIVE_BASENAME:/work:ro" ubuntu:24.04 \
            sh -ec 'if [ "$VARIANT" = all-features ]; then apt-get update -qq; apt-get install -y --no-install-recommends libpcap0.8t64 >/dev/null; fi; /work/packetcraftr --version; /work/packetcraftr reference protocols >/dev/null; /work/packetcraftr analyze tls /work/examples/captures/tls-handshake.pcapng'
      - name: Upload binary archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARCHIVE_BASENAME }}
          path: ${{ runner.temp }}/${{ env.ARCHIVE_BASENAME }}.${{ matrix.target.archive_extension }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish GitHub release
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.preflight.outputs.version }}
      RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.release_sha }}
      - name: Ensure the release tag has not moved
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
        run: |
          set -euo pipefail
          git fetch --force origin \
            "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$RELEASE_SHA"
      - name: Download binary archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packetcraftr-v${{ needs.preflight.outputs.version }}-*
          path: dist
          merge-multiple: true
      - name: Download release metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-metadata
          path: release-metadata
      - name: Validate assets and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t archives < <(
            find dist -maxdepth 1 -type f \
              \( -name '*.tar.gz' -o -name '*.zip' \) -printf '%f\n' |
              LC_ALL=C sort
          )
          if [[ "${#archives[@]}" -ne 10 ]]; then
            echo "expected exactly ten release archives, found ${#archives[@]}" >&2
            printf 'found: %s\n' "${archives[@]}" >&2
            exit 1
          fi

          targets=(
            x86_64-unknown-linux-gnu
            aarch64-unknown-linux-gnu
            x86_64-apple-darwin
            aarch64-apple-darwin
            x86_64-pc-windows-msvc
          )
          variants=(all-features pcap-free)
          for target in "${targets[@]}"; do
            extension=tar.gz
            if [[ "$target" == x86_64-pc-windows-msvc ]]; then
              extension=zip
            fi
            for variant in "${variants[@]}"; do
              asset="dist/packetcraftr-v${VERSION}-${target}-${variant}.${extension}"
              if [[ ! -f "$asset" ]]; then
                echo "missing expected release archive: $asset" >&2
                exit 1
              fi
            done
          done

          cp release-metadata/validation/VALIDATION-EVIDENCE.json dist/
          (
            cd dist
            printf '%s\n' "${archives[@]}" |
              while IFS= read -r archive; do
                sha256sum "$archive"
              done > SHA256SUMS
            sha256sum VALIDATION-EVIDENCE.json >> SHA256SUMS
            sha256sum --check SHA256SUMS
          )
      - name: Attest release archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Compose release notes
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          ### Binary variants

          - `all-features` includes Layer 2 capture and injection. Linux and macOS
            require libpcap at runtime; Windows requires Npcap 1.88 at runtime.
          - `pcap-free` retains interface enumeration, native routing, and raw
            Layer 3 support without Layer 2 capture/injection or a libpcap/Npcap
            runtime dependency.

          ### Validation evidence

          `VALIDATION-EVIDENCE.json` identifies the exact-commit decoder comparison
          and isolated Linux native scenarios. Windows/macOS runtime scenarios are
          explicitly unexercised.

          ### Checksums and Provenance

          Download `SHA256SUMS` with the archives and verify it with
          `sha256sum --check SHA256SUMS` (or `shasum -a 256 -c SHA256SUMS` on
          macOS).

          Verify GitHub artifact attestations with:
          `gh attestation verify packetcraftr-v<version>-<target>-<variant>.<ext> --owner tyk-swe`
          EOF
      - name: Create GitHub release
        shell: bash
        env:
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
        run: |
          set -euo pipefail
          prerelease_args=()
          if [[ "$PRERELEASE" == true ]]; then
            prerelease_args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag \
            --title "PacketcraftR v${VERSION}" \
            --notes-file release-notes.md \
            "${prerelease_args[@]}"
