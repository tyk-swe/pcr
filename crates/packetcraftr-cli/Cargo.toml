[package]
name = "packetcraftr-cli"
description = "PacketcraftR command-line interface and renderers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["native-route"]
native-route = ["packetcraftr/native-route"]
native-layer2 = ["packetcraftr/native-layer2"]
native-layer3 = ["packetcraftr/native-layer3"]

[dependencies]
ctrlc.workspace = true
bytes.workspace = true
anstream.workspace = true
packetcraftr-core.workspace = true
packetcraftr-netio.workspace = true
thiserror.workspace = true
clap.workspace = true
packetcraftr.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[dev-dependencies]
proptest.workspace = true
jsonschema.workspace = true

[[bin]]
name = "packetcraftr"
path = "src/main.rs"
# The binary intentionally shares its name with the facade library, so exclude
# it from `cargo doc` to avoid a colliding output path.
doc = false
