name: Reviewed macOS and Windows native validation

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full reviewed commit SHA; dispatch only after source review
        type: string
        required: true
      scenario:
        description: Select the inventory, scoped targets, discovery, OS identification, or TCP diagnostics
        type: choice
        options:
          - all
          - scoped_ipv6_targets
          - host_discovery
          - os_identification
          - tcp_diagnostics
        default: all

permissions:
  contents: read

jobs:
  native-platform-review:
    name: Reviewed host-local native (${{ matrix.os }})
    environment: native-review
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            python: python3
          - os: macos-15-intel
            python: python3
          - os: windows-2022
            python: python
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Require an immutable reviewed commit
        shell: bash
        env:
          REVIEWED_COMMIT: ${{ inputs.commit }}
        run: |
          [[ "$REVIEWED_COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Bind execution to the requested commit
        shell: bash
        env:
          REVIEWED_COMMIT: ${{ inputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$REVIEWED_COMMIT"
      - name: Initialize honest unexercised platform inventory
        shell: bash
        run: |
          if [[ "${{ inputs.scenario }}" == tcp_diagnostics ]]; then
            ${{ matrix.python }} scripts/test-tcp-diagnostics-native.py --reviewed-commit "${{ inputs.commit }}" \
              --emit-unavailable runtime_evidence_missing --report target/validation/tcp-diagnostics-native.json
          elif [[ "${{ inputs.scenario }}" == host_discovery ]]; then
            ${{ matrix.python }} scripts/test-host-discovery-native.py --emit-unavailable \
              --report target/validation/host-discovery.json
          elif [[ "${{ inputs.scenario }}" == os_identification ]]; then
            ${{ matrix.python }} scripts/test-os-identification-native.py --initialize-only \
              --reviewed-commit "${{ inputs.commit }}" --output target/validation/os-native.json
          else
            ${{ matrix.python }} scripts/test-native-platform.py --emit-unavailable \
              --report target/validation/native-platform.json
          fi
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: Build reviewed OS identification CLI
        if: inputs.scenario == 'os_identification'
        shell: bash
        run: cargo build --locked -p packetcraftr-cli --all-features
      - name: Exercise reviewed macOS host-local scenarios
        if: runner.os == 'macOS'
        shell: bash
        env:
          REVIEWED_COMMIT: ${{ inputs.commit }}
          SCENARIO: ${{ inputs.scenario }}
        run: |
          if [[ "$SCENARIO" == tcp_diagnostics ]]; then
            sudo -n env "PATH=$PATH" "RUSTUP_HOME=$HOME/.rustup" "CARGO_HOME=$HOME/.cargo" \
              python3 scripts/test-tcp-diagnostics-native.py --reviewed-commit "$REVIEWED_COMMIT" \
              --report target/validation/tcp-diagnostics-native.json
            exit
          fi
          if [[ "$SCENARIO" == host_discovery ]]; then
            sudo -n env "PATH=$PATH" "RUSTUP_HOME=$HOME/.rustup" "CARGO_HOME=$HOME/.cargo" \
              python3 scripts/test-host-discovery-native.py --reviewed-commit "$REVIEWED_COMMIT" \
              --report target/validation/host-discovery.json
            exit
          fi
          if [[ "$SCENARIO" == os_identification ]]; then
            sudo -n env "PATH=$PATH" "RUSTUP_HOME=$HOME/.rustup" "CARGO_HOME=$HOME/.cargo" \
              python3 scripts/test-os-identification-native.py --reviewed-commit "$REVIEWED_COMMIT" \
              --output target/validation/os-native.json
            exit
          fi
          sudo -n env "PATH=$PATH" "RUSTUP_HOME=$HOME/.rustup" "CARGO_HOME=$HOME/.cargo" \
            python3 scripts/test-native-platform.py --reviewed-commit "$REVIEWED_COMMIT" \
            --scenario "$SCENARIO" \
            --report target/validation/native-platform.json
      - name: Exercise reviewed Windows host-local scenarios
        if: runner.os == 'Windows'
        shell: bash
        env:
          REVIEWED_COMMIT: ${{ inputs.commit }}
          SCENARIO: ${{ inputs.scenario }}
        run: |
          if [[ "$SCENARIO" == tcp_diagnostics ]]; then
            python scripts/test-tcp-diagnostics-native.py --reviewed-commit "$REVIEWED_COMMIT" \
              --report target/validation/tcp-diagnostics-native.json
            exit
          fi
          if [[ "$SCENARIO" == host_discovery ]]; then
            python scripts/test-host-discovery-native.py --reviewed-commit "$REVIEWED_COMMIT" \
              --report target/validation/host-discovery.json
            exit
          fi
          if [[ "$SCENARIO" == os_identification ]]; then
            python scripts/test-os-identification-native.py --reviewed-commit "$REVIEWED_COMMIT" \
              --output target/validation/os-native.json
            exit
          fi
          python scripts/test-native-platform.py --reviewed-commit "$REVIEWED_COMMIT" \
            --scenario "$SCENARIO" \
            --report target/validation/native-platform.json
      - name: Preserve evidence even when build or native execution fails
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reviewed-native-platform-${{ matrix.os }}-${{ inputs.commit }}
          path: target/validation/
          if-no-files-found: error
          retention-days: 90
