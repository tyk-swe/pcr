name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example, v0.5.0-beta.1)
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag }}

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  preflight:
    name: validate release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      release_sha: ${{ steps.provenance.outputs.release_sha }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - name: Require the tagged commit to be on the default branch
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD)"
          default_branch="$(
            gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch
          )"
          git fetch --no-tags origin \
            "+refs/heads/${default_branch}:refs/remotes/origin/${default_branch}"
          git merge-base --is-ancestor \
            "$release_sha" "refs/remotes/origin/${default_branch}"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
      - name: Require successful CI for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          successful_runs="$(
            gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f head_sha="$(git rev-parse HEAD)" \
              -f status=success \
              --jq '[.workflow_runs[] | select(.event == "push")] | length'
          )"
          test "$successful_runs" -gt 0
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          tool: cargo-deny@0.20.2
      - name: Recheck current advisories and dependency policy for release contents
        run: |
          cargo deny --locked check
          cargo deny --locked --manifest-path fuzz/Cargo.toml check advisories
      - name: Validate tag and extract changelog section
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          cargo metadata --locked --no-deps --format-version 1 \
            > "$RUNNER_TEMP/cargo-metadata.json"
          version="$(
            python3 - "$RUNNER_TEMP/cargo-metadata.json" <<'PY'
          import json
          import pathlib
          import sys

          metadata = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          # The workspace root is virtual; the released artifact is the CLI.
          released = [
              package
              for package in metadata["packages"]
              if package["name"] == "packetcraftr-cli"
          ]
          if len(released) != 1:
              raise SystemExit("could not identify exactly one packetcraftr-cli package")
          print(released[0]["version"])
          PY
          )"

          expected_tag="v${version}"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "tag '$RELEASE_TAG' does not match packetcraftr-cli version '$expected_tag'" >&2
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/release-metadata"
          python3 - "$version" "$RUNNER_TEMP/release-metadata/changelog.md" <<'PY'
          import datetime
          import pathlib
          import re
          import sys

          version = sys.argv[1]
          destination = pathlib.Path(sys.argv[2])
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = re.compile(
              rf"^## \[{re.escape(version)}\] - (\d{{4}}-\d{{2}}-\d{{2}})$",
              re.MULTILINE,
          )
          matches = list(heading.finditer(changelog))
          if len(matches) != 1:
              raise SystemExit(
                  f"expected exactly one dated CHANGELOG.md section for {version}, "
                  f"found {len(matches)}"
              )

          try:
              datetime.date.fromisoformat(matches[0].group(1))
          except ValueError as error:
              raise SystemExit(f"invalid changelog date for {version}: {error}") from error

          section_start = matches[0].end()
          next_heading = re.search(r"^## \[", changelog[section_start:], re.MULTILINE)
          section_end = (
              section_start + next_heading.start() if next_heading else len(changelog)
          )
          section = changelog[section_start:section_end].strip()
          if not section:
              raise SystemExit(f"CHANGELOG.md section for {version} is empty")
          destination.write_text(f"{section}\n", encoding="utf-8")
          PY

          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Upload release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metadata
          path: ${{ runner.temp }}/release-metadata/
          if-no-files-found: error
          retention-days: 1

  build:
    name: build (${{ matrix.target.triple }}, ${{ matrix.variant.name }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        target:
          - triple: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            archive_extension: tar.gz
          - triple: x86_64-apple-darwin
            os: macos-15-intel
            archive_extension: tar.gz
          - triple: aarch64-apple-darwin
            os: macos-14
            archive_extension: tar.gz
          - triple: x86_64-pc-windows-msvc
            os: windows-2022
            archive_extension: zip
        variant:
          - name: all-features
            cargo_args: --all-features
          - name: pcap-free
            cargo_args: --no-default-features --features native-layer3
    runs-on: ${{ matrix.target.os }}
    timeout-minutes: 30
    env:
      ARCHIVE_BASENAME: packetcraftr-v${{ needs.preflight.outputs.version }}-${{ matrix.target.triple }}-${{ matrix.variant.name }}
      TARGET: ${{ matrix.target.triple }}
      VARIANT: ${{ matrix.variant.name }}
      VERSION: ${{ needs.preflight.outputs.version }}
      RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-release-v2-${{ matrix.target.triple }}-${{ matrix.variant.name }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-release-v2-${{ matrix.target.triple }}-${{ matrix.variant.name }}-${{ hashFiles('rust-toolchain.toml') }}-
      - if: runner.os == 'Linux' && matrix.variant.name == 'all-features'
        name: Install libpcap development files
        run: sudo apt-get update && sudo apt-get install --yes libpcap-dev
      - name: Install Rust target
        run: rustup target add ${{ matrix.target.triple }}
      - name: Build release binary
        run: >-
          cargo build --locked --release --package packetcraftr-cli
          --target ${{ matrix.target.triple }} ${{ matrix.variant.cargo_args }}
      - name: Record packaged build identity
        shell: bash
        run: |
          executable="target/$TARGET/release/packetcraftr"
          if [[ "$RUNNER_OS" == Windows ]]; then executable="$executable.exe"; fi
          python scripts/build-manifest.py --binary "$executable" \
            --output "$RUNNER_TEMP/BUILD-METADATA.json" --commit "$RELEASE_SHA" \
            --target "$TARGET" --variant "$VARIANT"
      - if: runner.os != 'Windows'
        name: Package Unix archive
        shell: bash
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/$ARCHIVE_BASENAME"
          mkdir -p "$staging"
          cp "target/$TARGET/release/packetcraftr" "$staging/packetcraftr"
          cp LICENSE "$staging/LICENSE"
          cp README.md "$staging/README.md"
          cp CHANGELOG.md "$staging/CHANGELOG.md"
          cp "$RUNNER_TEMP/BUILD-METADATA.json" "$staging/BUILD-METADATA.json"
          cp -R schemas "$staging/schemas"
          cp -R docs "$staging/docs"
          mkdir -p "$staging/examples/captures" "$staging/examples/documents"
          cp examples/captures/tls-handshake.pcapng "$staging/examples/captures/"
          cp examples/documents/packet-ipv4-udp.json "$staging/examples/documents/"
          cp examples/documents/output-stats-resources.json "$staging/examples/documents/"
          cp examples/documents/output-read-resources.json "$staging/examples/documents/"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/$ARCHIVE_BASENAME.tar.gz" \
            "$ARCHIVE_BASENAME"
      - if: runner.os == 'Windows'
        name: Package Windows archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $staging = Join-Path $env:RUNNER_TEMP $env:ARCHIVE_BASENAME
          $archive = Join-Path $env:RUNNER_TEMP "$($env:ARCHIVE_BASENAME).zip"
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item "target/$env:TARGET/release/packetcraftr.exe" $staging
          Copy-Item "LICENSE" $staging
          Copy-Item "README.md" $staging
          Copy-Item "CHANGELOG.md" $staging
          Copy-Item "$env:RUNNER_TEMP/BUILD-METADATA.json" $staging
          Copy-Item "schemas" (Join-Path $staging "schemas") -Recurse
          Copy-Item "docs" (Join-Path $staging "docs") -Recurse
          New-Item -ItemType Directory -Path `
            (Join-Path $staging "examples/captures"), `
            (Join-Path $staging "examples/documents") | Out-Null
          Copy-Item "examples/captures/tls-handshake.pcapng" (Join-Path $staging "examples/captures")
          Copy-Item "examples/documents/packet-ipv4-udp.json" (Join-Path $staging "examples/documents")
          Copy-Item "examples/documents/output-stats-resources.json" (Join-Path $staging "examples/documents")
          Copy-Item "examples/documents/output-read-resources.json" (Join-Path $staging "examples/documents")
          Compress-Archive -Path $staging -DestinationPath $archive
      - if: runner.os != 'Windows'
        name: Smoke-test Unix archive
        shell: bash
        run: |
          set -euo pipefail
          extraction="$RUNNER_TEMP/archive-smoke-test"
          mkdir -p "$extraction"
          tar -C "$extraction" -xzf "$RUNNER_TEMP/$ARCHIVE_BASENAME.tar.gz"
          executable="$extraction/$ARCHIVE_BASENAME/packetcraftr"
          test -x "$executable"
          python scripts/verify-archive.py --root "$extraction/$ARCHIVE_BASENAME" \
            --version "$VERSION" --commit "$RELEASE_SHA" --target "$TARGET" --variant "$VARIANT"
      - if: runner.os == 'Windows'
        name: Smoke-test Windows archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $extraction = Join-Path $env:RUNNER_TEMP "archive-smoke-test"
          $archive = Join-Path $env:RUNNER_TEMP "$($env:ARCHIVE_BASENAME).zip"
          Expand-Archive -Path $archive -DestinationPath $extraction
          python scripts/verify-archive.py --root (Join-Path $extraction $env:ARCHIVE_BASENAME) `
            --version $env:VERSION --commit $env:RELEASE_SHA --target $env:TARGET --variant $env:VARIANT
          if ($LASTEXITCODE -ne 0) { throw "packaged archive verification failed" }
      - if: runner.os == 'Linux' && matrix.variant.name == 'all-features'
        name: Verify full Linux binary links libpcap
        shell: bash
        run: ldd "target/$TARGET/release/packetcraftr" | grep -Eq 'libpcap\.so'
      - if: runner.os == 'Linux' && matrix.variant.name == 'pcap-free'
        name: Verify pcap-free Linux binary does not link libpcap
        shell: bash
        run: "! ldd \"target/$TARGET/release/packetcraftr\" | grep -Eq 'libpcap\\.so'"
      - if: runner.os == 'Linux'
        name: Smoke-test the Ubuntu 24.04 runtime baseline
        shell: bash
        run: |
          docker run --rm -e VARIANT -v "$RUNNER_TEMP/archive-smoke-test/$ARCHIVE_BASENAME:/work:ro" ubuntu:24.04 \
            sh -ec 'if [ "$VARIANT" = all-features ]; then apt-get update -qq; apt-get install -y --no-install-recommends libpcap0.8t64 >/dev/null; fi; /work/packetcraftr --version; /work/packetcraftr protocols >/dev/null; /work/packetcraftr tls /work/examples/captures/tls-handshake.pcapng'
      - name: Upload binary archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARCHIVE_BASENAME }}
          path: ${{ runner.temp }}/${{ env.ARCHIVE_BASENAME }}.${{ matrix.target.archive_extension }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish GitHub release
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.preflight.outputs.version }}
      RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.release_sha }}
      - name: Ensure the release tag has not moved
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
        run: |
          set -euo pipefail
          git fetch --force origin \
            "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$RELEASE_SHA"
      - name: Download binary archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: packetcraftr-v${{ needs.preflight.outputs.version }}-*
          path: dist
          merge-multiple: true
      - name: Download release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-metadata
          path: release-metadata
      - name: Validate assets and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            x86_64-unknown-linux-gnu
            x86_64-apple-darwin
            aarch64-apple-darwin
            x86_64-pc-windows-msvc
          )
          variants=(all-features pcap-free)
          for target in "${targets[@]}"; do
            extension=tar.gz
            if [[ "$target" == x86_64-pc-windows-msvc ]]; then
              extension=zip
            fi
            for variant in "${variants[@]}"; do
              asset="dist/packetcraftr-v${VERSION}-${target}-${variant}.${extension}"
              if [[ ! -f "$asset" ]]; then
                echo "missing expected release archive: $asset" >&2
                exit 1
              fi
            done
          done

          (
            cd dist
            LC_ALL=C sha256sum *.tar.gz *.zip > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
      - name: Attest release archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Compose release notes
        shell: bash
        run: |
          set -euo pipefail
          cp release-metadata/changelog.md release-notes.md
          cat >> release-notes.md <<'EOF'

          ### Binary variants

          - `all-features` includes Layer 2 capture and injection. Linux and macOS
            require libpcap at runtime; Windows requires Npcap 1.88 at runtime.
          - `pcap-free` retains interface enumeration, native routing, and raw
            Layer 3 support without Layer 2 capture/injection or a libpcap/Npcap
            runtime dependency.

          ### Checksums and Provenance

          Download `SHA256SUMS` with the archives and verify it with
          `sha256sum --check SHA256SUMS` (or `shasum -a 256 -c SHA256SUMS` on
          macOS).

          Verify GitHub artifact attestations with:
          `gh attestation verify packetcraftr-v<version>-<target>-<variant>.<ext> --owner tyk-swe`
          EOF
      - name: Create GitHub release
        shell: bash
        env:
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
        run: |
          set -euo pipefail
          prerelease_args=()
          if [[ "$PRERELEASE" == true ]]; then
            prerelease_args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag \
            --title "PacketcraftR v${VERSION}" \
            --notes-file release-notes.md \
            "${prerelease_args[@]}"
