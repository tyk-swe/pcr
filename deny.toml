[graph]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = []

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "AGPL-3.0-only",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
# Zstd capture compression uses these exact BSD-3-Clause packages. Their
# redistribution notices are included in THIRD_PARTY_NOTICES.md and archives.
[[licenses.exceptions]]
name = "zstd"
version = "=0.14.3"
allow = ["BSD-3-Clause"]

[[licenses.exceptions]]
name = "zstd-safe"
version = "=8.2.0"
allow = ["BSD-3-Clause"]

[[licenses.exceptions]]
name = "zstd-sys"
version = "=2.1.2"
allow = ["BSD-3-Clause"]

# Rustls uses this exact constant-time primitives crate. Its BSD notice is
# reproduced in THIRD_PARTY_NOTICES.md alongside the reviewed TLS dependencies.
[[licenses.exceptions]]
name = "subtle"
version = "=2.6.1"
allow = ["BSD-3-Clause"]

# Bundled Mozilla trust anchors for authenticated TLS audits. The exact
# dependency's data license is reproduced in THIRD_PARTY_NOTICES.md.
[[licenses.exceptions]]
name = "webpki-roots"
version = "=1.0.11"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "simplest-path"
skip = [
    # Ring 0.17.14 requires getrandom 0.2; direct randomness uses 0.4.
    { name = "getrandom", version = "=0.2.17" },
    # rtnetlink 0.23 requires nix 0.30; ctrlc 3.5 uses 0.31 for portable signals.
    { name = "nix", version = "=0.30.1" },
    # pcap 2.5 pins these older runtime and build dependencies.
    { name = "bitflags", version = "=1.3.2" },
    { name = "errno", version = "=0.2.8" },
    { name = "libloading", version = "=0.8.9" },
    { name = "windows-sys", version = "=0.36.1" },
    # Current proc-macro dependencies still span syn 2 and syn 3.
    { name = "syn", version = "=2.0.119" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
