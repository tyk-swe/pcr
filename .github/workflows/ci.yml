name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    name: Python unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Python tools and run unit tests
        run: |
          python3 --version
          python3 -m compileall -q scripts examples/consumers
          python3 -m unittest discover -s scripts/tests -v
          python3 -O -m unittest discover -s scripts/tests -v

  linux:
    name: Linux full native
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native development library
        run: sudo apt-get update && sudo apt-get install --yes libpcap-dev
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ci-v1-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.toml', 'Cargo.lock') }}
      - name: Format
        run: |
          cargo fmt --all -- --check
      - name: Clippy for supported feature profiles
        shell: bash
        run: |
          cargo clippy --locked --workspace --all-targets --no-default-features -- -D warnings
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo clippy --locked --workspace --all-targets --no-default-features --features packetcraftr-cli/native-layer2 -- -D warnings
          cargo clippy --locked --workspace --all-targets --no-default-features --features packetcraftr-cli/native-layer3 -- -D warnings
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Run workspace tests with default, all, and Layer 2 only features
        run: |
          cargo test --locked --workspace
          cargo test --locked --workspace --all-features
          cargo test --locked --workspace --no-default-features --features packetcraftr-cli/native-layer2
      - name: Documentation for supported feature profiles
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --locked --workspace --no-default-features --no-deps --document-private-items
          cargo doc --locked --workspace --no-default-features --features packetcraftr-cli/native-layer3 --no-deps --document-private-items
          cargo doc --locked --workspace --all-features --no-deps --document-private-items
      - name: Drop workspace artifacts from the Cargo cache
        shell: bash
        run: |
          rm -rf target/*/incremental
          find target -maxdepth 3 -name '*packetcraftr*' -prune -exec rm -rf {} +

  msrv:
    name: Linux minimum supported Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native development library
        run: sudo apt-get update && sudo apt-get install --yes libpcap-dev
      - name: Install the minimum supported toolchain
        id: msrv
        run: |
          msrv="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["rust-version"])')"
          rustup toolchain install "$msrv" --profile minimal
          echo "version=$msrv" >> "$GITHUB_OUTPUT"
      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ci-v1-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.toml', 'Cargo.lock') }}
      - name: Check every workspace target with portable and all features
        run: |
          cargo +${{ steps.msrv.outputs.version }} check --locked --workspace --all-targets --no-default-features
          cargo +${{ steps.msrv.outputs.version }} check --locked --workspace --all-targets --all-features
      - name: Drop workspace artifacts from the Cargo cache
        shell: bash
        run: |
          rm -rf target/*/incremental
          find target -maxdepth 3 -name '*packetcraftr*' -prune -exec rm -rf {} +

  portable:
    name: Portable and pcap-free
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ci-v1-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.toml', 'Cargo.lock') }}
      - name: Run workspace tests without default features
        run: cargo test --locked --workspace --no-default-features
      - name: Run library examples
        run: |
          cargo run --locked -p packetcraftr-core --example build_decode_filter --no-default-features
          cargo run --locked -p packetcraftr-core --example capture_analysis --no-default-features
          cargo run --locked -p packetcraftr --example client_composition --no-default-features
      - name: Run tests with the pcap-free feature profile
        run: cargo test --locked -p packetcraftr-cli -p packetcraftr-netio --no-default-features --features packetcraftr-cli/native-layer3,packetcraftr-netio/native-layer3
      - name: Build the pcap-free CLI
        run: cargo build --locked -p packetcraftr-cli --no-default-features --features native-layer3
      - name: Drop workspace artifacts from the Cargo cache
        shell: bash
        run: |
          rm -rf target/*/incremental
          find target -maxdepth 3 -name '*packetcraftr*' -prune -exec rm -rf {} +

  platforms-clippy:
    name: Native clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The release workflow builds on these images; keep CI on the same baselines.
        os: [macos-14, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ci-v1-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.toml', 'Cargo.lock') }}
      - name: Clippy for supported feature profiles
        shell: bash
        run: |
          cargo clippy --locked --workspace --all-targets --no-default-features -- -D warnings
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo clippy --locked --workspace --all-targets --no-default-features --features packetcraftr-cli/native-layer2 -- -D warnings
          cargo clippy --locked --workspace --all-targets --no-default-features --features packetcraftr-cli/native-layer3 -- -D warnings
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Drop workspace artifacts from the Cargo cache
        shell: bash
        run: |
          rm -rf target/*/incremental
          find target -maxdepth 3 -name '*packetcraftr*' -prune -exec rm -rf {} +

  platforms-test:
    name: Native tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The release workflow builds on these images; keep CI on the same baselines.
        os: [macos-14, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ci-v1-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.toml', 'Cargo.lock') }}
      - name: Run workspace tests with default features
        run: cargo test --locked --workspace
      - name: Run workspace tests with all features
        run: cargo test --locked --workspace --all-features
      - name: Run workspace tests without default features
        run: cargo test --locked --workspace --no-default-features
      - name: Drop workspace artifacts from the Cargo cache
        shell: bash
        run: |
          rm -rf target/*/incremental
          find target -maxdepth 3 -name '*packetcraftr*' -prune -exec rm -rf {} +

  # Ratchet ledger: no crate has a blocking mutation or coverage gate yet.
  # Crates move to blocking gates one at a time as their test alignment
  # phase lands. Thresholds are never lowered once set.
  test-quality:
    name: Test quality baseline
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native development library
        run: sudo apt-get update && sudo apt-get install --yes libpcap-dev
      - name: Install the pinned toolchain with coverage tools
        run: |
          rustup toolchain install
          rustup component add llvm-tools-preview
      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ci-v1-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.toml', 'Cargo.lock') }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov
      - name: Report coverage summary
        run: cargo llvm-cov --locked --workspace --all-features --summary-only
      - name: Report mutant counts per crate
        shell: bash
        run: |
          cargo install --locked cargo-mutants
          for package in packetcraftr-core packetcraftr packetcraftr-cli packetcraftr-netio; do
            count="$(cargo mutants --list -p "$package" | wc -l)"
            echo "$package mutants: $count"
          done
      - name: Drop workspace artifacts from the Cargo cache
        shell: bash
        run: |
          rm -rf target/*/incremental
          find target -maxdepth 3 -name '*packetcraftr*' -prune -exec rm -rf {} +

  fuzz:
    name: Parser fuzzing
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the nightly toolchain and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install --locked cargo-fuzz
      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            fuzz/target
          key: ci-v1-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('fuzz/Cargo.toml', 'fuzz/Cargo.lock', '**/Cargo.toml', 'Cargo.lock') }}
      - name: Seed corpora from checked-in examples
        shell: bash
        run: |
          mkdir -p fuzz/corpus/capture_read fuzz/corpus/packet_decode fuzz/corpus/document_parse fuzz/corpus/dns_message
          cp examples/captures/*.pcap examples/captures/*.pcapng fuzz/corpus/capture_read/
          python3 scripts/fuzz_seeds.py --packet-dir fuzz/corpus/packet_decode --dns-dir fuzz/corpus/dns_message examples/captures/*.pcap
          cp examples/documents/*.json fuzz/corpus/document_parse/
      - name: Fuzz every target
        shell: bash
        run: |
          for target in capture_read packet_decode document_parse dns_message; do
            cargo +nightly fuzz run "$target" -- -max_total_time=120 -rss_limit_mb=2048
          done
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
