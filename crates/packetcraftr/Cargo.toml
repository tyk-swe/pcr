[dependencies]
bytes.workspace = true
packetcraftr-core.workspace = true
packetcraftr-netio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
jsonschema.workspace = true
