[package]
name = "packetcraftr-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
packetcraftr-core = { path = "../crates/packetcraftr-core" }
bytes = "1"
serde_json = "1"

[[bin]]
name = "packet_document_json"
path = "fuzz_targets/packet_document_json.rs"
test = false
doc = false

