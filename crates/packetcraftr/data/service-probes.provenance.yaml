manifest_version: 1

dataset:
  name: "project-service-probes"
  kind: "service"
  version: "1.1.0"
  packaged_as: "bundled"
  review_outcome: "accepted"

source:
  name: "PacketcraftR project-authored probes and literal claim fixtures"
  locator: "crates/packetcraftr/data/service-probes.json"
  retrieved: "2026-10-11"
  upstream_version: "none; project-authored"
  license: "AGPL-3.0-only"
  license_rationale: |
    The project authored every request, match literal, and fixture under its
    own license. Requests independently encode protocol constants from RFC
    4253 section 4.2, RFC 9110 section 9.3.2, RFC 1035 section 4.1.2, and RFC
    4892 section 2, RFC 5321 sections 4.3.1 and 4.5.3.1.5, and RFC 959
    section 4.2. Product names are factual labels in original fixtures. The
    small CPE vendor/product mappings are independently authored factual
    identifiers checked against the NIST National Vulnerability Database CPE
    search at https://nvd.nist.gov/products/cpe on 2026-10-11; no dictionary
    descriptions, third-party match expressions, or database files are copied.
    Vendor/product identifiers are factual labels, with no copied
    copyrightable descriptions or source selection; the project's original
    selection and document remain AGPL-3.0-only. No NVD endorsement,
    vulnerability assertion, or verified software identity is implied. Nmap
    content remains excluded from this dataset.

transforms:
  - step: "author"
    detail: |
      Encoded a closed probe set (passive SSH identification, HTTP/1.0 HEAD,
      nonrecursive root IN A, version.bind CH TXT, and passive SMTP/FTP
      connection greetings). Project-authored
      anchored literals match parsed software claims, and bounded extraction
      retains only ASCII version tokens. Each entry records its own source,
      license, maintainer, update date, and each probe's read-only review.
  - step: "expand-reviewed-training-corpus"
    detail: |
      Added Postfix and Exim software claims from the SMTP ESMTP greeting
      field, plus vsftpd and ProFTPD claims from explicit FTP greeting literals.
      The four original training service instances, exact bytes, associated
      rules, and expected labels are declared in
      crates/packetcraftr/data/service-probes.training.v1.json. Numeric 220
      replies alone do not identify software. SMTP hostnames refer to parsed
      greeting-domain octets; unrelated response text and endpoint names are
      not hostname evidence. CPEs carry static product names with wildcard
      versions; versions are never inserted into CPEs. Device metadata is
      available only through an explicit reviewed rule, and no bundled rule
      has a supported device classification.

maintenance:
  maintainer: "tyk-swe"
  refresh: |
    Review each proposed request against the cited standard and its read-only
    behavior. Re-review source redistribution terms and entry provenance;
    update entry dates and bump this independent version and the corpus
    version together. Run the unit tests; update schemas and examples if
    document syntax changes. New signatures require original, declared fixtures
    and retain unauthenticated confidence.

coverage:
  - fixture: "crates/packetcraftr/data/service-probes.training.v1.json"
    covers: |
      smtp-postfix-training -> postfix-claim; smtp-exim-training -> exim-claim;
      ftp-vsftpd-training -> vsftpd-claim; ftp-proftpd-training -> proftpd-claim.
      These are the complete product-positive instances written against for
      the four SMTP and FTP rule additions.
