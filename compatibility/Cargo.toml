[package]
name = "packetcraftr-downstream-contracts"
version = "0.0.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

# Deliberately outside the product workspace: these are independent consumers.
[workspace]

[dependencies]
packetcraftr-core = { path = "../crates/packetcraftr-core", version = "0.5.0-beta.3" }
packetcraftr-netio = { path = "../crates/packetcraftr-netio", version = "0.5.0-beta.3", default-features = false }
packetcraftr = { path = "../crates/packetcraftr", version = "0.5.0-beta.3", default-features = false }
packetcraftr-cli = { path = "../crates/packetcraftr-cli", version = "0.5.0-beta.3", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
