name: Reviewed native validation

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full reviewed commit SHA; run only after source review
        type: string
        required: true

permissions:
  contents: read

# Configure required reviewers on the native-review environment in repository
# settings. YAML cannot install that administrative protection. This workflow is
# manually dispatched by an authorized maintainer, never by pull_request_target.
jobs:
  native-review:
    name: Reviewed isolated native commit
    environment: native-review
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require an immutable reviewed commit
        env:
          REVIEWED_COMMIT: ${{ inputs.commit }}
        run: |
          [[ "$REVIEWED_COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Bind execution to the requested commit
        env:
          REVIEWED_COMMIT: ${{ inputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$REVIEWED_COMMIT"
      - name: Initialize native evidence
        run: |
          mkdir -p target/validation
          echo '{"status":"not_exercised","reason":"namespace launcher has not completed"}' > target/validation/native-isolated.json
          echo '{"schema":"packetcraftr.namespace-lifecycle/v1","status":"not_exercised","reason":"namespace lifecycle launcher has not completed"}' > target/validation/native-namespace-lifecycle.json
      - name: Install prerequisites
        run: |
          rustup toolchain install
          sudo apt-get update
          sudo apt-get install --yes libpcap-dev iproute2 util-linux uidmap
      - name: Authorize mapping the checkout owner into the namespace
        run: |
          echo "root:$(id -u):1" | sudo tee -a /etc/subuid
          echo "root:$(id -g):1" | sudo tee -a /etc/subgid
      - name: Build native CLI
        run: cargo build --locked --release -p packetcraftr-cli --all-features
      - name: Exercise the loopback exchange in a fresh isolated namespace
        run: sudo python3 scripts/test-native-isolated.py --binary target/release/packetcraftr --report target/validation/native-isolated.json
      - name: Build the explicit native namespace lifecycle test
        run: cargo test --locked --release -p packetcraftr-netio --all-features --lib --no-run --message-format=json > target/validation/netio-native-build.jsonl
      - name: Exercise namespace lifecycle in a separate fresh isolated namespace
        run: sudo python3 scripts/test-native-namespace-lifecycle.py --build-report target/validation/netio-native-build.jsonl --report target/validation/native-namespace-lifecycle.json
      - name: Preserve native evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reviewed-native-${{ inputs.commit }}
          path: target/validation/
          if-no-files-found: error
          retention-days: 90
