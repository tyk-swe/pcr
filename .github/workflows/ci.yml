name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install prerequisites
        run: |
          rustup toolchain install
          sudo apt-get update
          sudo apt-get install --yes libpcap-dev
      - name: Format
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Dependency direction
        run: python3 scripts/check-architecture.py
      - name: Test full native
        run: cargo test --locked --workspace --all-features
      - name: Test portable
        run: cargo test --locked --workspace --no-default-features
      - name: Test pcap-free
        run: cargo test --locked -p packetcraftr-cli -p packetcraftr-netio --no-default-features --features packetcraftr-cli/native-layer3,packetcraftr-netio/native-layer3
      - name: Verify the pcap-free CLI does not link libpcap
        run: |
          cargo build --locked -p packetcraftr-cli --no-default-features --features native-layer3
          ! ldd target/debug/packetcraftr | grep -q libpcap
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --locked --workspace --no-default-features --no-deps
          cargo doc --locked --workspace --no-default-features --features packetcraftr-cli/native-layer3 --no-deps
          cargo doc --locked --workspace --all-features --no-deps

  platforms:
    name: Native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The release workflow builds on these images; keep CI on the same baselines.
        os: [macos-14, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Test default features
        run: cargo test --locked -p packetcraftr-netio -p packetcraftr-cli
      - name: Test all features
        run: cargo test --locked -p packetcraftr-netio -p packetcraftr-cli --all-features

  native-isolated:
    name: Isolated Linux native
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install prerequisites
        run: |
          rustup toolchain install
          sudo apt-get update
          sudo apt-get install --yes libpcap-dev iproute2 util-linux
      - name: Build the native CLI and the native test executable
        run: |
          cargo build --locked --release -p packetcraftr-cli --all-features
          cargo test --locked -p packetcraftr-netio --all-features --test native_isolated --no-run --message-format=json > target/native-test-build.jsonl
          python3 - <<'PY'
          import json, os
          records = [json.loads(line) for line in open('target/native-test-build.jsonl')]
          binary, = [r['executable'] for r in records if r.get('reason') == 'compiler-artifact' and r.get('executable') and r['target']['name'] == 'native_isolated']
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write(f'NATIVE_TEST_BINARY={binary}\n')
          PY
      - name: Exercise native I/O in a fresh isolated namespace
        run: |
          sudo python3 scripts/test-native-isolated.py --binary target/release/packetcraftr \
            --native-test-binary "$NATIVE_TEST_BINARY" --report target/native-isolated.json

  deny:
    name: Dependency advisories and licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          tool: cargo-deny@0.20.2
      - name: Check dependency policy
        run: |
          cargo deny --locked check
          cargo deny --locked --manifest-path fuzz/Cargo.toml check advisories
