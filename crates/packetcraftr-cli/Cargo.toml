[package]
name = "packetcraftr-cli"
description = "PacketcraftR command-line interface and renderers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Match workspace builds so focused CLI builds can reuse workflow artifacts.
default = ["native-route", "packetcraftr/default"]
native-route = ["packetcraftr/native-route"]
# Packet I/O providers compile route lookup in, so they imply `native-route`.
native-layer2 = ["native-route", "packetcraftr/native-layer2"]
native-layer3 = ["native-route", "packetcraftr/native-layer3"]
# Exposes `test_support` to this package's integration tests, which enable it
# through the self dev-dependency below. Not a supported API.
test-support = []

[dependencies]
ctrlc.workspace = true
bytes.workspace = true
anstream.workspace = true
packetcraftr-core.workspace = true
packetcraftr-netio.workspace = true
thiserror.workspace = true
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
packetcraftr.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true

[dev-dependencies]
packetcraftr-cli = { workspace = true, features = ["test-support"] }
proptest.workspace = true
jsonschema.workspace = true

[[bin]]
name = "packetcraftr"
path = "src/main.rs"
# The binary intentionally shares its name with the facade library, so exclude
# it from `cargo doc` to avoid a colliding output path.
doc = false
