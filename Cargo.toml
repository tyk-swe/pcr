[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.4.0-beta.2"
edition = "2024"
rust-version = "1.96"
license = "AGPL-3.0-only"
repository = "https://github.com/tyk-swe/pcr"
publish = false

[workspace.lints.rust]
unreachable_pub = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[workspace.dependencies]
packetcraftr-capture = { path = "crates/packetcraftr-capture", version = "0.4.0-beta.2" }
packetcraftr-cli = { path = "crates/packetcraftr-cli", version = "0.4.0-beta.2" }
packetcraftr-client = { path = "crates/packetcraftr-client", version = "0.4.0-beta.2" }
packetcraftr-model = { path = "crates/packetcraftr-model", version = "0.4.0-beta.2" }
packetcraftr-net = { path = "crates/packetcraftr-net", version = "0.4.0-beta.2" }
packetcraftr-net-native = { path = "crates/packetcraftr-net-native", version = "0.4.0-beta.2" }
packetcraftr-output = { path = "crates/packetcraftr-output", version = "0.4.0-beta.2" }
packetcraftr-packet = { path = "crates/packetcraftr-packet", version = "0.4.0-beta.2" }
packetcraftr-policy = { path = "crates/packetcraftr-policy", version = "0.4.0-beta.2" }
packetcraftr-protocols = { path = "crates/packetcraftr-protocols", version = "0.4.0-beta.2" }
packetcraftr-session = { path = "crates/packetcraftr-session", version = "0.4.0-beta.2" }
packetcraftr-workflow = { path = "crates/packetcraftr-workflow", version = "0.4.0-beta.2" }
packetcraftr-workflow-client = { path = "crates/packetcraftr-workflow-client", version = "0.4.0-beta.2" }

anstream = "1"
anstyle = "1"
bytes = { version = "1", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
jsonschema = { version = "0.48", default-features = false }
noyalib = { version = "0.0.15", default-features = false, features = ["std", "fast-int", "fast-float"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["unbounded_depth"] }
sha2 = "0.10"
thiserror = "2"

futures-util = { version = "0.3", default-features = false }
libc = { version = "0.2", default-features = false }
libloading = { version = "0.9", default-features = false, features = ["std"] }
pcap = { version = "2.4", default-features = false }
pnet_datalink = { version = "0.35", default-features = false, features = ["std"] }
rtnetlink = { version = "0.21", default-features = false, features = ["tokio_socket"] }
socket2 = { version = "0.6", default-features = false, features = ["all"] }
tokio = { version = "1", default-features = false, features = ["net", "rt"] }
windows = { version = "0.62", default-features = false, features = [
    "std",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_SystemInformation",
] }

[profile.release]
# Packet offsets, lengths, and accounting must fail closed in optimized builds
# just as they do in development and CI profiles.
overflow-checks = true

[package]
name = "packetcraftr"
description = "Rust library and CLI for building, dissecting, capturing, and testing network packets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["cli", "native-interfaces"]
cli = ["dep:packetcraftr-cli"]
native-interfaces = ["packetcraftr-net-native/native-interfaces"]
native-route = ["packetcraftr-net-native/native-route"]
native-layer2 = ["packetcraftr-net-native/native-layer2"]
native-layer3 = ["packetcraftr-net-native/native-layer3"]

[dependencies]
packetcraftr-capture.workspace = true
packetcraftr-cli = { workspace = true, optional = true }
packetcraftr-client.workspace = true
packetcraftr-model.workspace = true
packetcraftr-net.workspace = true
packetcraftr-net-native.workspace = true
packetcraftr-output.workspace = true
packetcraftr-packet.workspace = true
packetcraftr-policy.workspace = true
packetcraftr-protocols.workspace = true
packetcraftr-session.workspace = true
packetcraftr-workflow.workspace = true
packetcraftr-workflow-client.workspace = true

[dev-dependencies]
anstream.workspace = true
bytes.workspace = true
jsonschema.workspace = true
serde.workspace = true
serde_json.workspace = true

[[bin]]
name = "packetcraftr"
path = "src/main.rs"
required-features = ["cli"]

[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["cli"]
