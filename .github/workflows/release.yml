name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  preflight:
    name: validate release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require successful CI for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          successful_runs="$(
            gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f head_sha="$GITHUB_SHA" \
              -f status=success \
              --jq '[.workflow_runs[] | select(.event == "push")] | length'
          )"
          test "$successful_runs" -gt 0
      - name: Validate tag and extract changelog section
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          cargo metadata --locked --no-deps --format-version 1 \
            > "$RUNNER_TEMP/cargo-metadata.json"
          version="$(
            python3 - "$RUNNER_TEMP/cargo-metadata.json" <<'PY'
          import json
          import pathlib
          import sys

          metadata = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          # The workspace root is virtual; the released artifact is the CLI.
          released = [
              package
              for package in metadata["packages"]
              if package["name"] == "packetcraftr-cli"
          ]
          if len(released) != 1:
              raise SystemExit("could not identify exactly one packetcraftr-cli package")
          print(released[0]["version"])
          PY
          )"

          expected_tag="v${version}"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "tag '$GITHUB_REF_NAME' does not match packetcraftr-cli version '$expected_tag'" >&2
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/release-metadata"
          python3 - "$version" "$RUNNER_TEMP/release-metadata/changelog.md" <<'PY'
          import datetime
          import pathlib
          import re
          import sys

          version = sys.argv[1]
          destination = pathlib.Path(sys.argv[2])
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = re.compile(
              rf"^## \[{re.escape(version)}\] - (\d{{4}}-\d{{2}}-\d{{2}})$",
              re.MULTILINE,
          )
          matches = list(heading.finditer(changelog))
          if len(matches) != 1:
              raise SystemExit(
                  f"expected exactly one dated CHANGELOG.md section for {version}, "
                  f"found {len(matches)}"
              )

          try:
              datetime.date.fromisoformat(matches[0].group(1))
          except ValueError as error:
              raise SystemExit(f"invalid changelog date for {version}: {error}") from error

          section_start = matches[0].end()
          next_heading = re.search(r"^## \[", changelog[section_start:], re.MULTILINE)
          section_end = (
              section_start + next_heading.start() if next_heading else len(changelog)
          )
          section = changelog[section_start:section_end].strip()
          if not section:
              raise SystemExit(f"CHANGELOG.md section for {version} is empty")
          destination.write_text(f"{section}\n", encoding="utf-8")
          PY

          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Upload release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metadata
          path: ${{ runner.temp }}/release-metadata/changelog.md
          if-no-files-found: error
          retention-days: 1

  build:
    name: build (${{ matrix.target.triple }}, ${{ matrix.variant.name }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        target:
          - triple: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            archive_extension: tar.gz
          - triple: x86_64-apple-darwin
            os: macos-15-intel
            archive_extension: tar.gz
          - triple: aarch64-apple-darwin
            os: macos-14
            archive_extension: tar.gz
          - triple: x86_64-pc-windows-msvc
            os: windows-2022
            archive_extension: zip
        variant:
          - name: all-features
            cargo_args: --all-features
          - name: pcap-free
            cargo_args: --no-default-features --features native-route,native-layer3
    runs-on: ${{ matrix.target.os }}
    timeout-minutes: 30
    env:
      ARCHIVE_BASENAME: packetcraftr-v${{ needs.preflight.outputs.version }}-${{ matrix.target.triple }}-${{ matrix.variant.name }}
      TARGET: ${{ matrix.target.triple }}
      VARIANT: ${{ matrix.variant.name }}
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-release-v1-${{ matrix.target.triple }}-${{ matrix.variant.name }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-release-v1-${{ matrix.target.triple }}-${{ matrix.variant.name }}-${{ hashFiles('rust-toolchain.toml') }}-
      - if: runner.os == 'Linux'
        name: Install Linux linker
        run: sudo apt-get update && sudo apt-get install --yes clang lld
      - if: runner.os == 'Linux' && matrix.variant.name == 'all-features'
        name: Install libpcap development files
        run: sudo apt-get install --yes libpcap-dev
      - name: Install Rust target
        run: rustup target add ${{ matrix.target.triple }}
      - name: Build release binary
        run: >-
          cargo build --locked --release --package packetcraftr-cli
          --target ${{ matrix.target.triple }} ${{ matrix.variant.cargo_args }}
      - if: runner.os != 'Windows'
        name: Package Unix archive
        shell: bash
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/$ARCHIVE_BASENAME"
          mkdir -p "$staging"
          cp "target/$TARGET/release/packetcraftr" "$staging/packetcraftr"
          cp LICENSE "$staging/LICENSE"
          cp README.md "$staging/README.md"
          cp CHANGELOG.md "$staging/CHANGELOG.md"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/$ARCHIVE_BASENAME.tar.gz" \
            "$ARCHIVE_BASENAME"
      - if: runner.os == 'Windows'
        name: Package Windows archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $staging = Join-Path $env:RUNNER_TEMP $env:ARCHIVE_BASENAME
          $archive = Join-Path $env:RUNNER_TEMP "$($env:ARCHIVE_BASENAME).zip"
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item "target/$env:TARGET/release/packetcraftr.exe" $staging
          Copy-Item "LICENSE" $staging
          Copy-Item "README.md" $staging
          Copy-Item "CHANGELOG.md" $staging
          Compress-Archive -Path $staging -DestinationPath $archive
      - if: runner.os != 'Windows'
        name: Smoke-test Unix archive
        shell: bash
        run: |
          set -uo pipefail

          # The release archive is exercised as a real installation: the
          # extracted binary is invoked by absolute path only, so the checks
          # can never pass by resolving another `packetcraftr` from PATH, the
          # build workspace, or target/.
          extraction="$RUNNER_TEMP/archive-smoke-test"
          rm -rf "$extraction"
          mkdir -p "$extraction"
          tar -C "$extraction" -xzf "$RUNNER_TEMP/$ARCHIVE_BASENAME.tar.gz"
          executable="$extraction/$ARCHIVE_BASENAME/packetcraftr"
          if [[ ! -x "$executable" ]]; then
            echo "packaged executable is missing or not executable: $executable" >&2
            exit 1
          fi
          for document in LICENSE README.md CHANGELOG.md; do
            document_path="$extraction/$ARCHIVE_BASENAME/$document"
            if [[ ! -s "$document_path" ]]; then
              echo "packaged $document is missing or empty: $document_path" >&2
              exit 1
            fi
          done

          # Run a command against the extracted binary and fail with a full
          # diagnostic (command, exit code, stdout, stderr) when the command
          # exits non-zero. On success the captured stdout and stderr paths are
          # left in the global CHECK_STDOUT_FILE and CHECK_STDERR_FILE so
          # callers can read/parse them and remove them. stdout/stderr are
          # captured separately so JSON parsing and panic/backtrace checks
          # target the right stream. Running the command directly (not in a
          # command substitution) lets an abort propagate to the whole script
          # instead of only a subshell.
          CHECK_STDOUT_FILE=""
          CHECK_STDERR_FILE=""
          run_check() {
            local description="$1"; shift
            local stdout_file stderr_file exit_code=0
            stdout_file="$(mktemp)"
            stderr_file="$(mktemp)"
            "$@" >"$stdout_file" 2>"$stderr_file" || exit_code=$?
            if (( exit_code != 0 )); then
              echo "FAILED: $description" >&2
              echo "  command: $*" >&2
              echo "  exit code: $exit_code" >&2
              echo "  stdout:" >&2
              sed 's/^/    /' "$stdout_file" >&2
              echo "  stderr:" >&2
              sed 's/^/    /' "$stderr_file" >&2
              rm -f "$stdout_file" "$stderr_file"
              return 1
            fi
            CHECK_STDOUT_FILE="$stdout_file"
            CHECK_STDERR_FILE="$stderr_file"
          }

          fail_assertion() {
            local description="$1"; shift
            echo "FAILED: $description" >&2
            if (( $# > 0 )); then
              printf '  %s\n' "$@" >&2
            fi
            return 1
          }

          # Read a captured stdout file, remove it, and print its contents.
          consume_stdout() {
            local file="$1"
            cat "$file"
            rm -f "$file"
          }

          # Fail if a captured stderr file contains a panic or backtrace
          # marker, then remove it.
          assert_clean_stderr() {
            local file="$1"
            local stderr_content
            stderr_content="$(cat "$file")"
            rm -f "$file"
            if [[ "$stderr_content" == *"panic"* || "$stderr_content" == *"backtrace"* ]]; then
              fail_assertion \
                "command wrote a panic or backtrace to stderr" \
                "stderr:" \
                "$stderr_content" || exit 1
            fi
          }

          # 1. --version exits successfully and reports the exact release
          # version.
          run_check \
            "packetcraftr --version succeeds" \
            "$executable" --version || exit 1
          version_output="$(consume_stdout "$CHECK_STDOUT_FILE")"
          rm -f "$CHECK_STDERR_FILE"
          version_expected="packetcraftr $VERSION"
          if [[ "$version_output" != "$version_expected" ]]; then
            fail_assertion \
              "packetcraftr --version reported an unexpected value" \
              "expected: $version_expected" \
              "actual:   $version_output" || exit 1
          fi

          # 2. --help exits successfully, names the program, and exposes
          # representative offline and native command groups. The full help
          # text is not snapshotted.
          run_check \
            "packetcraftr --help succeeds" \
            "$executable" --help || exit 1
          help_output="$(consume_stdout "$CHECK_STDOUT_FILE")"
          rm -f "$CHECK_STDERR_FILE"
          for expected in \
            "Usage: packetcraftr" \
            "Commands:" \
            "build" \
            "dissect" \
            "protocols" \
            "read" \
            "interfaces" \
            "routes" \
            "plan" \
            "send"
          do
            if [[ "$help_output" != *"$expected"* ]]; then
              fail_assertion \
                "packetcraftr --help is missing expected text: $expected" || exit 1
            fi
          done

          # 3. Raw packet build emits exactly the requested hex bytes after
          # removing only the platform trailing newline, and stderr must not
          # contain a panic or backtrace.
          run_check \
            "packetcraftr --output hex build raw(hex=deadbeef) succeeds" \
            "$executable" --output hex build --packet 'raw(hex=deadbeef)' || exit 1
          build_output="$(consume_stdout "$CHECK_STDOUT_FILE")"
          assert_clean_stderr "$CHECK_STDERR_FILE"
          build_hex="${build_output%$'\n'}"
          if [[ "$build_hex" != "deadbeef" ]]; then
            fail_assertion \
              "raw packet build did not emit exactly deadbeef" \
              "expected: deadbeef" \
              "actual:   $build_hex" || exit 1
          fi

          # 4. Structured protocol description identifies IPv4 with stable
          # envelope fields. Presentation text is not asserted.
          run_check \
            "packetcraftr --output json protocols ipv4 succeeds" \
            "$executable" --output json protocols ipv4 || exit 1
          protocols_stdout_file="$CHECK_STDOUT_FILE"
          rm -f "$CHECK_STDERR_FILE"
          python3 - "$protocols_stdout_file" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          payload = path.read_text(encoding="utf-8")
          try:
              document = json.loads(payload)
          except json.JSONDecodeError as error:
              raise SystemExit(
                  f"protocols ipv4 output is not valid JSON: {error}\n"
                  f"payload:\n{payload}"
              )
          finally:
              path.unlink(missing_ok=True)

          def fail(reason):
              raise SystemExit(
                  f"protocols ipv4 JSON assertion failed: {reason}\n"
                  f"payload:\n{payload}"
              )

          if document.get("schema") != "packetcraftr.output/v1":
              fail(f"schema is {document.get('schema')!r}, expected 'packetcraftr.output/v1'")
          if document.get("command") != "protocols":
              fail(f"command is {document.get('command')!r}, expected 'protocols'")
          if document.get("mode") != "aggregate":
              fail(f"mode is {document.get('mode')!r}, expected 'aggregate'")
          if document.get("status") != "success":
              fail(f"status is {document.get('status')!r}, expected 'success'")
          protocol = document.get("result", {}).get("protocol")
          if not isinstance(protocol, dict):
              fail(f"result.protocol is not an object: {protocol!r}")
          if protocol.get("protocol") != "ipv4":
              fail(f"result.protocol.protocol is {protocol.get('protocol')!r}, expected 'ipv4'")
          if "fields" not in protocol or not isinstance(protocol["fields"], list):
              fail("result.protocol.fields is missing or not a list")
          PY

          # 5. Structured dissection represents the supplied packet bytes.
          run_check \
            "packetcraftr --output json dissect deadbeef link-type 147 succeeds" \
            "$executable" --output json dissect --hex deadbeef --link-type 147 || exit 1
          dissect_stdout_file="$CHECK_STDOUT_FILE"
          rm -f "$CHECK_STDERR_FILE"
          python3 - "$dissect_stdout_file" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          payload = path.read_text(encoding="utf-8")
          try:
              document = json.loads(payload)
          except json.JSONDecodeError as error:
              raise SystemExit(
                  f"dissect output is not valid JSON: {error}\n"
                  f"payload:\n{payload}"
              )
          finally:
              path.unlink(missing_ok=True)

          def fail(reason):
              raise SystemExit(
                  f"dissect JSON assertion failed: {reason}\n"
                  f"payload:\n{payload}"
              )

          if document.get("schema") != "packetcraftr.output/v1":
              fail(f"schema is {document.get('schema')!r}, expected 'packetcraftr.output/v1'")
          if document.get("command") != "dissect":
              fail(f"command is {document.get('command')!r}, expected 'dissect'")
          if document.get("mode") != "aggregate":
              fail(f"mode is {document.get('mode')!r}, expected 'aggregate'")
          if document.get("status") != "success":
              fail(f"status is {document.get('status')!r}, expected 'success'")
          result = document.get("result", {})
          if not isinstance(result, dict):
              fail(f"result is not an object: {result!r}")
          if result.get("bytes_hex") != "deadbeef":
              fail(f"result.bytes_hex is {result.get('bytes_hex')!r}, expected 'deadbeef'")
          if result.get("link_type") != 147:
              fail(f"result.link_type is {result.get('link_type')!r}, expected 147")
          PY

          # 6. Machine output stays valid JSON with no ANSI escape sequence
          # under the strongest supported styling request.
          run_check \
            "packetcraftr --color always --output json protocols ipv4 succeeds" \
            "$executable" --color always --output json protocols ipv4 || exit 1
          styled_stdout_file="$CHECK_STDOUT_FILE"
          rm -f "$CHECK_STDERR_FILE"
          python3 - "$styled_stdout_file" <<'PY'
          import json
          import pathlib
          import re
          import sys

          path = pathlib.Path(sys.argv[1])
          payload = path.read_text(encoding="utf-8")
          try:
              document = json.loads(payload)
          except json.JSONDecodeError as error:
              raise SystemExit(
                  f"styled JSON output is not valid JSON: {error}\n"
                  f"payload:\n{payload}"
              )
          finally:
              path.unlink(missing_ok=True)

          if re.search(r"\x1b\[", payload):
              raise SystemExit(
                  "styled JSON output contains an ANSI escape sequence\n"
                  f"payload:\n{payload}"
              )
          if document.get("schema") != "packetcraftr.output/v1":
              raise SystemExit(
                  f"styled JSON schema is {document.get('schema')!r}, "
                  "expected 'packetcraftr.output/v1'\n"
                  f"payload:\n{payload}"
              )
          if document.get("status") != "success":
              raise SystemExit(
                  f"styled JSON status is {document.get('status')!r}, "
                  "expected 'success'\n"
                  f"payload:\n{payload}"
              )
          PY
      - if: runner.os == 'Windows'
        name: Smoke-test Windows archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $extraction = Join-Path $env:RUNNER_TEMP "archive-smoke-test"
          if (Test-Path $extraction) {
            Remove-Item -Recurse -Force $extraction
          }
          $archive = Join-Path $env:RUNNER_TEMP "$($env:ARCHIVE_BASENAME).zip"
          Expand-Archive -Path $archive -DestinationPath $extraction
          # The extracted binary is invoked by absolute path only, so the
          # checks can never pass by resolving another `packetcraftr` from
          # PATH, the build workspace, or target/.
          $packagedPath = "$($env:ARCHIVE_BASENAME)/packetcraftr.exe"
          $executable = Join-Path $extraction $packagedPath
          if (-not (Test-Path -PathType Leaf $executable)) {
            throw "packaged executable is missing: $executable"
          }
          foreach ($document in @("LICENSE", "README.md", "CHANGELOG.md")) {
            $documentPath = Join-Path $extraction "$($env:ARCHIVE_BASENAME)/$document"
            if (
              -not (Test-Path -PathType Leaf $documentPath) -or
              (Get-Item $documentPath).Length -eq 0
            ) {
              throw "packaged $document is missing or empty: $documentPath"
            }
          }

          # Run a command against the extracted binary and fail with a full
          # diagnostic (command, exit code, stdout, stderr) when an assertion
          # breaks. On success the captured stdout and stderr are normalized
          # as strings in the script-scoped $CheckStdout and $CheckStderr
          # variables so callers can assert on them. stderr is redirected to a
          # temporary file so it stays separate from stdout for JSON parsing
          # and panic/backtrace checks. The native call runs with
          # ErrorActionPreference temporarily set to Continue so stderr text
          # never trips the outer Stop preference, and array splatting
          # preserves each argument verbatim.
          $script:CheckStdout = ""
          $script:CheckStderr = ""
          function Invoke-PacketcraftrCheck {
            param(
              [string]$Description,
              [string[]]$Arguments
            )
            $stderrPath = [System.IO.Path]::GetTempFileName()
            $outerPreference = $ErrorActionPreference
            $ErrorActionPreference = "Continue"
            try {
              $stdout = & $executable @Arguments 2>$stderrPath
              $exitCode = $LASTEXITCODE
            } finally {
              $ErrorActionPreference = $outerPreference
            }
            $stderr = Get-Content -Raw $stderrPath -ErrorAction SilentlyContinue
            if ($null -eq $stdout) {
              $stdout = ""
            } else {
              $stdout = $stdout -join [System.Environment]::NewLine
            }
            if ($null -eq $stderr) { $stderr = "" }
            Remove-Item -Force $stderrPath -ErrorAction SilentlyContinue
            if ($exitCode -ne 0) {
              $message = @"
          FAILED: $Description
            command: $executable $($Arguments -join ' ')
            exit code: $exitCode
            stdout:
          $stdout
            stderr:
          $stderr
          "@
              Write-Error $message
              exit 1
            }
            $script:CheckStdout = $stdout
            $script:CheckStderr = $stderr
          }

          # 1. --version exits successfully and reports the exact release
          # version.
          Invoke-PacketcraftrCheck `
            "packetcraftr --version succeeds" `
            @("--version")
          $version = $script:CheckStdout.Trim()
          $versionExpected = "packetcraftr $env:VERSION"
          if ($version -ne $versionExpected) {
            throw @"
          FAILED: packetcraftr --version reported an unexpected value
            expected: $versionExpected
            actual:   $version
          "@
          }

          # 2. --help exits successfully, names the program, and exposes
          # representative offline and native command groups. The full help
          # text is not snapshotted.
          Invoke-PacketcraftrCheck `
            "packetcraftr --help succeeds" `
            @("--help")
          $help = $script:CheckStdout
          foreach ($expected in @(
            "Usage: packetcraftr",
            "Commands:",
            "build",
            "dissect",
            "protocols",
            "read",
            "interfaces",
            "routes",
            "plan",
            "send"
          )) {
            if (-not $help.Contains($expected)) {
              throw "FAILED: packetcraftr --help is missing expected text: $expected"
            }
          }

          # 3. Raw packet build emits exactly the requested hex bytes after
          # removing only the platform trailing newline, and stderr must not
          # contain a panic or backtrace.
          Invoke-PacketcraftrCheck `
            "packetcraftr --output hex build raw(hex=deadbeef) succeeds" `
            @("--output", "hex", "build", "--packet", "raw(hex=deadbeef)")
          $buildHex = $script:CheckStdout.TrimEnd("`r", "`n")
          $buildStderr = $script:CheckStderr
          if ($buildHex -ne "deadbeef") {
            throw @"
          FAILED: raw packet build did not emit exactly deadbeef
            expected: deadbeef
            actual:   $buildHex
          "@
          }
          if ($buildStderr -match "panic" -or $buildStderr -match "backtrace") {
            throw @"
          FAILED: raw packet build wrote a panic or backtrace to stderr
            stderr:
          $buildStderr
          "@
          }

          # 4. Structured protocol description identifies IPv4 with stable
          # envelope fields. Presentation text is not asserted.
          Invoke-PacketcraftrCheck `
            "packetcraftr --output json protocols ipv4 succeeds" `
            @("--output", "json", "protocols", "ipv4")
          $protocols = $script:CheckStdout | ConvertFrom-Json
          if ($protocols.schema -ne "packetcraftr.output/v1") {
            throw "FAILED: protocols ipv4 schema is $($protocols.schema), expected 'packetcraftr.output/v1'"
          }
          if ($protocols.command -ne "protocols") {
            throw "FAILED: protocols ipv4 command is $($protocols.command), expected 'protocols'"
          }
          if ($protocols.mode -ne "aggregate") {
            throw "FAILED: protocols ipv4 mode is $($protocols.mode), expected 'aggregate'"
          }
          if ($protocols.status -ne "success") {
            throw "FAILED: protocols ipv4 status is $($protocols.status), expected 'success'"
          }
          if ($protocols.result.protocol.protocol -ne "ipv4") {
            throw "FAILED: protocols ipv4 result.protocol.protocol is $($protocols.result.protocol.protocol), expected 'ipv4'"
          }

          # 5. Structured dissection represents the supplied packet bytes.
          Invoke-PacketcraftrCheck `
            "packetcraftr --output json dissect deadbeef link-type 147 succeeds" `
            @("--output", "json", "dissect", "--hex", "deadbeef", "--link-type", "147")
          $dissect = $script:CheckStdout | ConvertFrom-Json
          if ($dissect.schema -ne "packetcraftr.output/v1") {
            throw "FAILED: dissect schema is $($dissect.schema), expected 'packetcraftr.output/v1'"
          }
          if ($dissect.command -ne "dissect") {
            throw "FAILED: dissect command is $($dissect.command), expected 'dissect'"
          }
          if ($dissect.mode -ne "aggregate") {
            throw "FAILED: dissect mode is $($dissect.mode), expected 'aggregate'"
          }
          if ($dissect.status -ne "success") {
            throw "FAILED: dissect status is $($dissect.status), expected 'success'"
          }
          if ($dissect.result.bytes_hex -ne "deadbeef") {
            throw "FAILED: dissect result.bytes_hex is $($dissect.result.bytes_hex), expected 'deadbeef'"
          }
          if ($dissect.result.link_type -ne 147) {
            throw "FAILED: dissect result.link_type is $($dissect.result.link_type), expected 147"
          }

          # 6. Machine output stays valid JSON with no ANSI escape sequence
          # under the strongest supported styling request.
          Invoke-PacketcraftrCheck `
            "packetcraftr --color always --output json protocols ipv4 succeeds" `
            @("--color", "always", "--output", "json", "protocols", "ipv4")
          $styledJson = $script:CheckStdout
          $styled = $styledJson | ConvertFrom-Json
          if ($styled.schema -ne "packetcraftr.output/v1") {
            throw "FAILED: styled JSON schema is $($styled.schema), expected 'packetcraftr.output/v1'"
          }
          if ($styled.status -ne "success") {
            throw "FAILED: styled JSON status is $($styled.status), expected 'success'"
          }
          if ($styledJson -match "\x1b\[") {
            throw "FAILED: styled JSON output contains an ANSI escape sequence"
          }
      - if: runner.os == 'Linux' && matrix.variant.name == 'all-features'
        name: Verify full Linux binary links libpcap
        shell: bash
        run: ldd "target/$TARGET/release/packetcraftr" | grep -Eq 'libpcap\.so'
      - if: runner.os == 'Linux' && matrix.variant.name == 'pcap-free'
        name: Verify pcap-free Linux binary does not link libpcap
        shell: bash
        run: "! ldd \"target/$TARGET/release/packetcraftr\" | grep -Eq 'libpcap\\.so'"
      - name: Upload binary archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARCHIVE_BASENAME }}
          path: ${{ runner.temp }}/${{ env.ARCHIVE_BASENAME }}.${{ matrix.target.archive_extension }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish GitHub release
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download binary archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: packetcraftr-v${{ needs.preflight.outputs.version }}-*
          path: dist
          merge-multiple: true
      - name: Download release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-metadata
          path: release-metadata
      - name: Validate assets and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t archives < <(
            find dist -maxdepth 1 -type f \
              \( -name '*.tar.gz' -o -name '*.zip' \) -printf '%f\n' |
              LC_ALL=C sort
          )
          if [[ "${#archives[@]}" -ne 8 ]]; then
            echo "expected exactly eight release archives, found ${#archives[@]}" >&2
            printf 'found: %s\n' "${archives[@]}" >&2
            exit 1
          fi

          targets=(
            x86_64-unknown-linux-gnu
            x86_64-apple-darwin
            aarch64-apple-darwin
            x86_64-pc-windows-msvc
          )
          variants=(all-features pcap-free)
          for target in "${targets[@]}"; do
            extension=tar.gz
            if [[ "$target" == x86_64-pc-windows-msvc ]]; then
              extension=zip
            fi
            for variant in "${variants[@]}"; do
              asset="dist/packetcraftr-v${VERSION}-${target}-${variant}.${extension}"
              if [[ ! -f "$asset" ]]; then
                echo "missing expected release archive: $asset" >&2
                exit 1
              fi
            done
          done

          (
            cd dist
            printf '%s\n' "${archives[@]}" |
              while IFS= read -r archive; do
                sha256sum "$archive"
              done > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
      - name: Compose release notes
        shell: bash
        run: |
          set -euo pipefail
          cp release-metadata/changelog.md release-notes.md
          cat >> release-notes.md <<'EOF'

          ### Binary variants

          - `all-features` includes Layer 2 capture and injection. Linux and macOS
            require libpcap at runtime; Windows requires Npcap 1.88 at runtime.
          - `pcap-free` retains interface enumeration, native routing, and raw
            Layer 3 support without Layer 2 capture/injection or a libpcap/Npcap
            runtime dependency.

          ### Checksums

          Download `SHA256SUMS` with the archives and verify it with
          `sha256sum --check SHA256SUMS` (or `shasum -a 256 -c SHA256SUMS` on
          macOS).
          EOF
      - name: Create GitHub release
        shell: bash
        env:
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
        run: |
          set -euo pipefail
          prerelease_args=()
          if [[ "$PRERELEASE" == true ]]; then
            prerelease_args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "PacketcraftR v${VERSION}" \
            --notes-file release-notes.md \
            "${prerelease_args[@]}"
