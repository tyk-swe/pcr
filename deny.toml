[graph]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"
# No advisory exceptions. RUSTSEC-2024-0436 (`paste`) was closed by the
# rtnetlink 0.23 / netlink-packet-core 0.9 update.
ignore = []

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "AGPL-3.0-only",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "simplest-path"
skip = [
    # pcap 2.5 pins these older runtime and build dependencies.
    { name = "bitflags", version = "=1.3.2" },
    { name = "windows-sys", version = "=0.36.1" },
    { name = "errno", version = "=0.2.8" },
    { name = "libloading", version = "=0.8.9" },
    # Current proc-macro dependencies still span syn 2 and syn 3.
    { name = "syn", version = "=2.0.119" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
