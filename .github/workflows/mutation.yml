name: Mutation audit

on:
  workflow_call:
    inputs:
      base:
        type: string
        default: ''

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      python: ${{ steps.scope.outputs.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: scope
        env:
          BASE: ${{ inputs.base }}
        run: |
          if [ -n "$BASE" ]; then
            python3 scripts/run_mutation.py select --base "$BASE" --plan mutation-plan.json
          else
            python3 scripts/run_mutation.py select --full --plan mutation-plan.json
          fi
          python3 - <<'PY'
          import json, os
          targets = json.load(open('mutation-plan.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for language in ('rust', 'python'):
                  print(f'{language}={str(any(t["language"] == language for t in targets)).lower()}', file=output)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mutation-plan
          path: mutation-plan.json

  rust:
    needs: select
    if: needs.select.outputs.rust == 'true'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-24.04, macos-14, macos-15-intel, windows-2022]
        profile: [portable, default, layer2, layer3, all]
    uses: ./.github/workflows/mutation-rust.yml
    with:
      os: ${{ matrix.os }}
      profile: ${{ matrix.profile }}

  python:
    needs: select
    if: needs.select.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: mutation-plan
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/run_mutation.py run --plan mutation-plan.json --language python --output mutation-results
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mutation-python
          path: mutation-results
          if-no-files-found: error

  policy:
    needs: [select, rust, python]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: mutation-plan
      - name: Prepare score directory
        if: always()
        run: mkdir -p mutation-results/scores
      - if: needs.select.outputs.rust == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: mutation-receipts-rust-*
          path: mutation-results/rust
      - if: needs.select.outputs.rust == 'true'
        run: python3 scripts/run_mutation.py check --plan mutation-plan.json --language rust --output mutation-results/rust --shards 64 --platforms ubuntu-24.04 macos-14 macos-15-intel windows-2022 --profiles portable default layer2 layer3 all > mutation-results/scores/rust-scores.jsonl
      - if: always() && needs.select.outputs.python == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: mutation-python
          path: mutation-results/python
      - if: always() && needs.select.outputs.python == 'true'
        run: python3 scripts/run_mutation.py check --plan mutation-plan.json --language python --output mutation-results/python > mutation-results/scores/python-scores.jsonl
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mutation-scores
          path: mutation-results/scores/*-scores.jsonl
      - if: always()
        env:
          SELECT: ${{ needs.select.result }}
          RUST: ${{ needs.rust.result }}
          PYTHON: ${{ needs.python.result }}
        run: |
          test "$SELECT" = success
          test "$RUST" = success -o "$RUST" = skipped
          test "$PYTHON" = success -o "$PYTHON" = skipped
