[package]
name = "packetcraftr-net"
description = "Interface, route, capture, and transmission providers plus native I/O boundaries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# This is the only PacketcraftR crate permitted to contain `unsafe` code, and
# it owns every native-I/O Cargo feature. Every other crate forbids unsafe at
# its own crate root.

[lints]
workspace = true

[features]
native-interfaces = ["dep:pnet_datalink", "dep:windows"]
native-route = [
    "native-interfaces",
    "dep:futures-util",
    "dep:libc",
    "dep:rtnetlink",
    "dep:socket2",
    "dep:tokio",
    "dep:windows",
]
native-layer2 = ["native-interfaces", "dep:libloading", "dep:pcap"]
native-layer3 = ["native-interfaces", "dep:socket2"]

[dependencies]
bytes.workspace = true
packetcraftr-capture.workspace = true
packetcraftr-error.workspace = true
packetcraftr-packet.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
packetcraftr-protocol.workspace = true

[target.'cfg(not(windows))'.dependencies]
pnet_datalink = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
futures-util = { workspace = true, optional = true }
pcap = { workspace = true, optional = true }
rtnetlink = { workspace = true, optional = true }
socket2 = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["time"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = { workspace = true, optional = true }
pcap = { workspace = true, optional = true }
socket2 = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
libloading = { workspace = true, optional = true }
socket2 = { workspace = true, optional = true }
windows = { workspace = true, optional = true }
