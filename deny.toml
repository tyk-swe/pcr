[graph]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 is an unmaintained build-time transitive dependency of rtnetlink/netlink-packet-core; exact lockfile exception expires 2026-10-12" },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "AGPL-3.0-only",
    "ISC",
    "MIT",
    "Unicode-3.0",
]
[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "simplest-path"
skip = [
    { name = "bitflags", version = "=1.3.2" },
    { name = "syn", version = "=2.0.119" },
    { name = "thiserror", version = "=1.0.69" },
    { name = "thiserror-impl", version = "=1.0.69" },
    { name = "windows-sys", version = "=0.36.1" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
