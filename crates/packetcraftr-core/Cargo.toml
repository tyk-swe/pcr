[package]
name = "packetcraftr-core"
description = "Runtime-neutral packet mechanics and bounded offline analysis for PacketcraftR"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# Deliberately runtime-neutral: this crate must not depend on
# `packetcraftr-netio` or `packetcraftr`. Keeping packet and offline analysis
# below those crates makes native I/O unavailable by construction.
[dependencies]
bytes.workspace = true
md-5.workspace = true
noyalib.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
tempfile.workspace = true

[[bench]]
name = "benchmarks"
harness = false
