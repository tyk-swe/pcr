name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    name: Python unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the JSON Schema validator
        run: sudo apt-get update && sudo apt-get install --yes python3-jsonschema
      - name: Check Python tools and run unit tests
        run: |
          python3 --version
          python3 -m compileall -q scripts examples/consumers
          python3 scripts/agent_skills.py --check
          python3 -m unittest discover -s scripts/tests -v
          python3 -O -m unittest discover -s scripts/tests -v

  linux:
    name: Linux full native
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native development library and the JSON Schema validator
        run: sudo apt-get update && sudo apt-get install --yes libpcap-dev python3-jsonschema
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ci-v1-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.toml', 'Cargo.lock') }}
      - name: Format
        run: |
          cargo fmt --all -- --check
      - name: Check documented crate layers
        run: python3 scripts/check_layers.py
      - name: Report test layer coupling
        run: python3 scripts/check_layers.py --report-tests
      - name: Rank file lengths and enforce the non-test limit
        run: python3 scripts/check_file_lengths.py
      - name: Check implicit-coupling ceilings
        run: python3 scripts/check_coupling.py
      - name: Clippy for supported feature profiles
        shell: bash
        run: |
          cargo clippy --locked --workspace --all-targets --no-default-features -- -D warnings
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo clippy --locked --workspace --all-targets --no-default-features --features packetcraftr-cli/native-layer2 -- -D warnings
          cargo clippy --locked --workspace --all-targets --no-default-features --features packetcraftr-cli/native-layer3 -- -D warnings
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Run workspace tests with default, all, and Layer 2 only features
        run: |
          cargo test --locked --workspace
          cargo test --locked --workspace --all-features
          cargo test --locked --workspace --no-default-features --features packetcraftr-cli/native-layer2
      - name: Validate examples and runtime output against the current output schema
        run: python3 scripts/check_output_schema.py --binary target/debug/packetcraftr
      - name: Documentation for supported feature profiles
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --locked --workspace --no-default-features --no-deps --document-private-items
          cargo doc --locked --workspace --no-default-features --features packetcraftr-cli/native-layer3 --no-deps --document-private-items
          cargo doc --locked --workspace --all-features --no-deps --document-private-items
      - name: Drop workspace artifacts from the Cargo cache
        shell: bash
        run: |
          if [ -d target ]; then
            rm -rf target/*/incremental
            find target -maxdepth 3 -name '*packetcraftr*' -prune -exec rm -rf {} +
          fi

  msrv:
    name: Linux minimum supported Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native development library
        run: sudo apt-get update && sudo apt-get install --yes libpcap-dev
      - name: Install the minimum supported toolchain
        id: msrv
        run: |
          msrv="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["rust-version"])')"
          rustup toolchain install "$msrv" --profile minimal
          echo "version=$msrv" >> "$GITHUB_OUTPUT"
      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ci-v1-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.toml', 'Cargo.lock') }}
      - name: Check every workspace target with portable and all features
        run: |
          cargo +${{ steps.msrv.outputs.version }} check --locked --workspace --all-targets --no-default-features
          cargo +${{ steps.msrv.outputs.version }} check --locked --workspace --all-targets --all-features
      - name: Drop workspace artifacts from the Cargo cache
        shell: bash
        run: |
          if [ -d target ]; then
            rm -rf target/*/incremental
            find target -maxdepth 3 -name '*packetcraftr*' -prune -exec rm -rf {} +
          fi

  portable:
    name: Portable and pcap-free
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ci-v1-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.toml', 'Cargo.lock') }}
      - name: Run workspace tests without default features
        run: cargo test --locked --workspace --no-default-features
      - name: Run library examples
        run: |
          cargo run --locked -p packetcraftr-core --example build_decode_filter --no-default-features
          cargo run --locked -p packetcraftr-core --example capture_analysis --no-default-features
          cargo run --locked -p packetcraftr --example client_composition --no-default-features
      - name: Run tests with the pcap-free feature profile
        run: cargo test --locked -p packetcraftr-cli -p packetcraftr-netio --no-default-features --features packetcraftr-cli/native-layer3,packetcraftr-netio/native-layer3
      - name: Build the pcap-free CLI
        run: cargo build --locked -p packetcraftr-cli --no-default-features --features native-layer3
      - name: Drop workspace artifacts from the Cargo cache
        shell: bash
        run: |
          if [ -d target ]; then
            rm -rf target/*/incremental
            find target -maxdepth 3 -name '*packetcraftr*' -prune -exec rm -rf {} +
          fi

  platforms-clippy:
    name: Native clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The release workflow builds on these images; keep CI on the same baselines.
        os: [macos-14, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ci-v1-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.toml', 'Cargo.lock') }}
      - name: Clippy for supported feature profiles
        shell: bash
        run: |
          cargo clippy --locked --workspace --all-targets --no-default-features -- -D warnings
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo clippy --locked --workspace --all-targets --no-default-features --features packetcraftr-cli/native-layer2 -- -D warnings
          cargo clippy --locked --workspace --all-targets --no-default-features --features packetcraftr-cli/native-layer3 -- -D warnings
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Drop workspace artifacts from the Cargo cache
        shell: bash
        run: |
          if [ -d target ]; then
            rm -rf target/*/incremental
            find target -maxdepth 3 -name '*packetcraftr*' -prune -exec rm -rf {} +
          fi

  platforms-test:
    name: Native tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The release workflow builds on these images; keep CI on the same baselines.
        os: [macos-14, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ci-v1-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.toml', 'Cargo.lock') }}
      - name: Run workspace tests with default features
        run: cargo test --locked --workspace
      - name: Run workspace tests with all features
        run: cargo test --locked --workspace --all-features
      - name: Run workspace tests without default features
        run: cargo test --locked --workspace --no-default-features
      - name: Drop workspace artifacts from the Cargo cache
        shell: bash
        run: |
          if [ -d target ]; then
            rm -rf target/*/incremental
            find target -maxdepth 3 -name '*packetcraftr*' -prune -exec rm -rf {} +
          fi

  # Ratchet ledger: packetcraftr has blocking coverage and mutation gates in
  # test-quality-gate below. Other crates move to blocking gates one at a
  # time as their test alignment phase lands. Thresholds are never lowered.
  test-quality:
    name: Test quality baseline
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native development library
        run: sudo apt-get update && sudo apt-get install --yes libpcap-dev
      - name: Install the pinned toolchain with coverage tools
        run: |
          rustup toolchain install
          rustup component add llvm-tools-preview
      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ci-v1-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.toml', 'Cargo.lock') }}
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-llvm-cov
      - name: Report coverage summary
        run: cargo llvm-cov --locked --workspace --all-features --summary-only
      - name: Report mutant counts per crate
        shell: bash
        run: |
          cargo install --locked cargo-mutants
          for package in packetcraftr-core packetcraftr packetcraftr-cli packetcraftr-netio; do
            count="$(cargo mutants --list -p "$package" | wc -l)"
            echo "$package mutants: $count"
          done
      - name: Drop workspace artifacts from the Cargo cache
        shell: bash
        run: |
          if [ -d target ]; then
            rm -rf target/*/incremental
            find target -maxdepth 3 -name '*packetcraftr*' -prune -exec rm -rf {} +
          fi

  test-quality-gate:
    name: Test quality gate (packetcraftr)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native development library
        run: sudo apt-get update && sudo apt-get install --yes libpcap-dev
      - name: Install the pinned toolchain with coverage tools
        run: |
          rustup toolchain install
          rustup component add llvm-tools-preview
      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ci-v1-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.toml', 'Cargo.lock') }}
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-llvm-cov
      - name: Enforce packetcraftr line coverage floor (measured 30.08%)
        run: cargo llvm-cov --locked -p packetcraftr --all-features --fail-under-lines 30 --summary-only
      - name: Install cargo-mutants
        run: cargo install --locked cargo-mutants
      # The excluded decode_response mutant swaps | for ^ on disjoint bit
      # ranges (extended rcode shifted by 4, low rcode in the last 4 bits),
      # so it cannot change any outcome and no test can kill it.
      - name: Enforce mutation gate on dns wire files (83 of 83 viable caught)
        run: >-
          cargo mutants -p packetcraftr
          -f 'crates/packetcraftr/src/dns/wire/decode.rs'
          -f 'crates/packetcraftr/src/dns/wire/encode.rs'
          -f 'crates/packetcraftr/src/dns/wire/name.rs'
          -f 'crates/packetcraftr/src/dns/wire/error.rs'
          -E 'replace \| with \^ in decode_response'
      - name: Drop workspace artifacts from the Cargo cache
        shell: bash
        run: |
          if [ -d target ]; then
            rm -rf target/*/incremental
            find target -maxdepth 3 -name '*packetcraftr*' -prune -exec rm -rf {} +
          fi

  # Mutation gates on repaired security boundaries. A timeout means the
  # mutant hung the tests (for example an infinite read loop), so it is
  # accepted only when missed.txt is empty; cargo-mutants reports timeouts
  # ahead of misses in its exit code.
  test-quality-boundaries:
    name: Mutation gate (${{ matrix.gate }})
    strategy:
      fail-fast: false
      matrix:
        gate: [audit, http-policy, mqtt, staged-input]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native development library
        run: sudo apt-get update && sudo apt-get install --yes libpcap-dev
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ci-v1-${{ github.job }}-${{ matrix.gate }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.toml', 'Cargo.lock') }}
      - name: Install cargo-mutants
        run: cargo install --locked cargo-mutants
      - name: Enforce mutation gates (all viable mutants caught when measured)
        shell: bash
        run: |
          gate() {
            local status=0
            mkdir -p mutants
            cargo mutants -o mutants "$@" || status=$?
            if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then
              return "$status"
            fi
            if [ -s mutants/mutants.out/missed.txt ]; then
              cat mutants/mutants.out/missed.txt
              return 2
            fi
          }
          case "${{ matrix.gate }}" in
            # audit and policy declarations: 57 caught, 26 unviable.
            audit)
              gate -p packetcraftr \
                -f crates/packetcraftr/src/audit.rs \
                -f crates/packetcraftr/src/policy/operation.rs ;;
            # CSP, X-Frame-Options, and HSTS parsing: 75 caught, 2 timeouts, 7 unviable.
            http-policy)
              gate -p packetcraftr-core \
                -f crates/packetcraftr-core/src/security/http/policy.rs ;;
            # MQTT fields a packet type does not carry: 46 caught, 3 unviable.
            mqtt)
              gate -p packetcraftr-core \
                -f crates/packetcraftr-core/src/protocol/application/mqtt.rs -F uncarried ;;
            # Staged output and cancellable input: 52 caught, 7 timeouts, 20 unviable.
            # Exclusions: `|` to `^` on disjoint open flags is equivalent; the
            # cfg(not(unix)) bodies are not compiled on Linux; CLOEXEC and
            # NOFOLLOW on an unpredictable 64-bit staging name, the renameat2
            # fallback errno set, a WouldBlock after a ready poll, and the
            # forced-exit staging removal cannot be reached deterministically.
            staged-input)
              gate -p packetcraftr-cli \
                -f crates/packetcraftr-cli/src/staged_output.rs \
                -f crates/packetcraftr-cli/src/staged_output/unix.rs \
                -f crates/packetcraftr-cli/src/input/source.rs \
                -E 'replace \| with \^ in (Directory::open|Directory::stage|anchored)' \
                -E 'unix.rs:65:76: replace \| with & in Directory::stage' \
                -E 'source.rs:(91|96):5: replace (open|stdin) -> io::Result<Source>' \
                -E 'source.rs:152:24: replace match guard .* with false' \
                -E 'match guard \[Errno::INVAL, Errno::NOSYS, Errno::OPNOTSUPP, Errno::NOTSUP\]' \
                -E 'replace <impl StagedEntry for StagingName>::remove with \(\)' ;;
          esac
      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-results-${{ matrix.gate }}
          path: mutants
          if-no-files-found: ignore
      - name: Drop workspace artifacts from the Cargo cache
        shell: bash
        run: |
          if [ -d target ]; then
            rm -rf target/*/incremental
            find target -maxdepth 3 -name '*packetcraftr*' -prune -exec rm -rf {} +
          fi

  fuzz-smoke:
    name: Fuzz smoke run
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the nightly toolchain and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install --locked cargo-fuzz
      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            fuzz/target
          key: ci-v1-fuzz-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('fuzz/Cargo.toml', 'fuzz/Cargo.lock', '**/Cargo.toml', 'Cargo.lock') }}
      # Pull requests only read the evolved corpus; the scheduled job owns updates.
      - name: Restore the evolved fuzz corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-v1-${{ github.run_id }}
          restore-keys: fuzz-corpus-v1-
      - name: Seed corpora from checked-in examples
        run: scripts/fuzz_seed_corpora.sh
      - name: Fuzz every target briefly
        shell: bash
        run: |
          for target in $(cargo +nightly fuzz list --fuzz-dir fuzz); do
            cargo +nightly fuzz run --fuzz-dir fuzz "$target" -- -max_total_time=20 -rss_limit_mb=2048
          done
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-smoke-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore

  fuzz:
    name: Parser fuzzing
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the nightly toolchain and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install --locked cargo-fuzz
      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            fuzz/target
          key: ci-v1-fuzz-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('fuzz/Cargo.toml', 'fuzz/Cargo.lock', '**/Cargo.toml', 'Cargo.lock') }}
      # A per-run key with a prefix restore lets every scheduled run save its
      # minimized corpus while the next run starts from the latest one.
      - name: Restore and save the evolved fuzz corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-v1-${{ github.run_id }}
          restore-keys: fuzz-corpus-v1-
      - name: Seed corpora from checked-in examples
        run: scripts/fuzz_seed_corpora.sh
      - name: Fuzz every target
        shell: bash
        run: |
          for target in $(cargo +nightly fuzz list --fuzz-dir fuzz); do
            cargo +nightly fuzz run --fuzz-dir fuzz "$target" -- -max_total_time=120 -rss_limit_mb=2048
          done
      - name: Minimize every corpus
        shell: bash
        run: |
          for target in $(cargo +nightly fuzz list --fuzz-dir fuzz); do
            cargo +nightly fuzz cmin --fuzz-dir fuzz "$target"
          done
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
      - name: Upload the minimized corpus
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-corpus
          path: fuzz/corpus
          retention-days: 14
          if-no-files-found: ignore
