[package]
name = "packetcraftr-analysis"
description = "Bounded offline capture analysis, expert diagnostics, and stream reassembly for PacketcraftR"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# Offline by construction: this crate must not depend on `packetcraftr-client`
# or `packetcraftr-net`. Analysis runs without authorization gates because it
# has no resolver, route, capture, or transmission seam, and the absence of
# those dependencies is what keeps that true.
[dependencies]
bytes.workspace = true
packetcraftr-capture.workspace = true
packetcraftr-core.workspace = true
packetcraftr-packet.workspace = true
packetcraftr-protocol.workspace = true
serde.workspace = true
thiserror.workspace = true
