name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-no-default
            os: ubuntu-latest
            cargo_args: --no-default-features
            native_packages: false
          - name: ubuntu-default
            os: ubuntu-latest
            cargo_args: ""
            native_packages: false
          - name: macos-no-default
            os: macos-latest
            cargo_args: --no-default-features
            native_packages: false
          - name: macos-default
            os: macos-latest
            cargo_args: ""
            native_packages: false
          - name: windows-no-default
            os: windows-latest
            cargo_args: --no-default-features
            native_packages: false
          - name: windows-default
            os: windows-latest
            cargo_args: ""
            native_packages: false
          - name: ubuntu-all-features
            os: ubuntu-latest
            cargo_args: --all-features
            native_packages: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux native dependencies
        if: matrix.native_packages
        run: sudo apt-get update && sudo apt-get install --yes libpcap-dev
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          # Keep in step with `nextest-version` in .config/nextest.toml.
          tool: nextest@0.9.143
      - name: Run tests
        run: cargo nextest run --locked --workspace --profile ci ${{ matrix.cargo_args }}
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-${{ matrix.name }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: error

  native-all-features:
    name: Native all-features check (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
          - name: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Check all native features
        run: cargo check --locked --workspace --all-targets --all-features

  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux native dependencies
        run: sudo apt-get update && sudo apt-get install --yes libpcap-dev
      - name: Install the pinned toolchain
        # rustup reads `rust-toolchain.toml` (channel and components) so the
        # version is stated once, in that file.
        run: rustup toolchain install
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-deny
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Build API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps
      - name: Run doctests
        run: cargo test --locked --workspace --all-features --doc
      - name: Check dependency policy
        run: cargo deny check

  msrv:
    name: MSRV (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no-default
            cargo_args: --no-default-features
          - name: all-features
            cargo_args: --all-features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux native dependencies
        run: sudo apt-get update && sudo apt-get install --yes libpcap-dev
      # The only job that overrides `rust-toolchain.toml`. Keep in step with
      # `rust-version` in Cargo.toml.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.0
      - name: Check workspace
        run: cargo check --locked --workspace --all-targets ${{ matrix.cargo_args }}
