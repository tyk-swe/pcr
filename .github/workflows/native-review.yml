name: Reviewed native validation

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full reviewed commit SHA; run only after source review
        type: string
        required: true

permissions:
  contents: read

# Configure required reviewers on the native-review environment in repository
# settings. YAML cannot install that administrative protection. This workflow is
# manually dispatched by an authorized maintainer, never by pull_request_target.
jobs:
  native-review:
    name: Reviewed isolated native commit
    environment: native-review
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require an immutable reviewed commit
        env:
          REVIEWED_COMMIT: ${{ inputs.commit }}
        run: |
          [[ "$REVIEWED_COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Bind execution to the requested commit
        env:
          REVIEWED_COMMIT: ${{ inputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$REVIEWED_COMMIT"
      - name: Initialize native evidence
        run: |
          mkdir -p target/validation
          echo '{"status":"not_exercised","reason":"namespace launcher has not completed"}' > target/validation/native-isolated.json
      - name: Install prerequisites
        run: |
          rustup toolchain install
          sudo apt-get update
          sudo apt-get install --yes libpcap-dev iproute2 util-linux uidmap
      - name: Authorize mapping the checkout owner into the namespace
        run: |
          echo "root:$(id -u):1" | sudo tee -a /etc/subuid
          echo "root:$(id -g):1" | sudo tee -a /etc/subgid
      - name: Build native CLI and native contract executable
        run: |
          cargo build --locked --release -p packetcraftr-cli --all-features
          cargo test --locked -p packetcraftr-netio --all-features --test native_isolated --no-run --message-format=json > target/native-test-build.jsonl
          python3 - <<'PY'
          import json, os
          records = [json.loads(line) for line in open('target/native-test-build.jsonl')]
          binary, = [r['executable'] for r in records if r.get('reason') == 'compiler-artifact' and r.get('executable') and r['target']['name'] == 'native_isolated']
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write(f'NATIVE_TEST_BINARY={binary}\n')
          PY
      - name: Exercise native I/O in a fresh isolated namespace
        run: |
          sudo python3 scripts/test-native-isolated.py --binary target/release/packetcraftr \
            --native-test-binary "$NATIVE_TEST_BINARY" --report target/validation/native-isolated.json
      - name: Preserve native evidence even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reviewed-native-${{ inputs.commit }}
          path: target/validation/
          if-no-files-found: error
          retention-days: 90
