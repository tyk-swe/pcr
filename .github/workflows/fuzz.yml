name: Fuzz

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Per-target exploration seconds (30 smoke, up to 900 campaign)
        type: choice
        options: ["30", "300", "900"]
        default: "30"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }}, ${{ inputs.seconds || 30 }}s)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target:
          - packet_document_json
          - packet_document_yaml
          - pcap_parse
          - pcapng_parse
          - packet_decode
          - tcp_reassembly
          - ip_reassembly
          - tls_assembly
          - filter_parse
          - dns_name
          - dns_message
          - tcp_schedule
          - packet_build
          - tls_session
          - tls_schedule
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nightly toolchain for libfuzzer
        run: rustup toolchain install nightly-2026-08-28 --component llvm-tools-preview
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          tool: cargo-fuzz@0.13.2
      - name: Run bounded fuzzing
        working-directory: fuzz
        env:
          FUZZ_SECONDS: ${{ inputs.seconds || 30 }}
          FUZZ_TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "corpora/$FUZZ_TARGET"
          corpus=("corpora/$FUZZ_TARGET")
          dictionary=()
          # Published examples double as seeds.
          case "$FUZZ_TARGET" in
            packet_document_json|packet_build) corpus+=("../examples/documents") ;;
            pcap_parse|pcapng_parse|tls_session) corpus+=("../examples/captures") ;;
          esac
          case "$FUZZ_TARGET" in
            packet_document_json|packet_build) dictionary+=("-dict=dictionaries/json.dict") ;;
            packet_document_yaml) dictionary+=("-dict=dictionaries/yaml.dict") ;;
            tls_assembly) dictionary+=("-dict=dictionaries/tls.dict") ;;
            filter_parse) dictionary+=("-dict=dictionaries/filter.dict") ;;
          esac
          # Prebuilt cargo-fuzz may default to its own musl build target;
          # AddressSanitizer needs the runner's dynamically linked GNU target.
          cargo +nightly-2026-08-28 fuzz run --target x86_64-unknown-linux-gnu "$FUZZ_TARGET" "${corpus[@]}" -- "${dictionary[@]}" -max_total_time="$FUZZ_SECONDS" -rss_limit_mb=2048 -max_len=1048576
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/*
          if-no-files-found: ignore
          retention-days: 7
